name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — the last one to
# start still wins, and a half-deployed site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on for the repo the first time this runs.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The pages at the root are generated from design-system/patterns/, and
      # five routines edit the landing pattern hourly. Rebuilding here — rather
      # than trusting whatever was committed — is what makes a forgotten
      # `python3 scripts/build-site.py` cost nothing: the artifact is always
      # built from the patterns as they stand at this commit. It writes into the
      # checkout and nothing is pushed back; the design-system workflow is what
      # keeps the committed copies honest.
      #
      # Still no dependencies: stdlib python, same as every check.
      # The English edition first: build-site.py ships design-system/patterns/en/
      # as /en/, and that directory is itself generated from the German patterns
      # by build-i18n.py. Rebuilding both here, in order, is what makes the
      # deploy independent of whether either was regenerated before the commit.
      - name: Build the English edition from the German patterns
        run: python3 scripts/build-i18n.py

      - name: Build the site from the design system's patterns
        run: python3 scripts/build-site.py

      # THE ARTIFACT USED TO BE THE REPOSITORY AND IS NOW THE WEBSITE.
      #
      # `path: .` uploaded the whole tracked checkout — upload-pages-artifact
      # excludes .git and .github and nothing else — so the public site served
      # every file in the repository. Verified by fetching them rather than
      # assumed: /scripts/build-site.py, /worker/index.js, /wrangler.toml,
      # /content/jobs/.catalogue.json and /docs/…/*.png all answered 200, and so
      # did twelve committed editor autosaves until they were deleted.
      #
      # stage-site.py already computed the right answer for Cloudflare: the pages
      # build-site.py ships, asked of that file rather than typed here, plus
      # design-system/ (the assets every page loads and the documentation, which
      # is published on purpose). Pages ships the same directory now, which also
      # makes the two deploys the same bytes instead of two lists that agree by
      # habit. --surface pages leaves out the _headers file that marks the
      # Cloudflare copy noindex — this host is the one that must be indexed.
      #
      # The URLs do not change: dist/ reproduces the root layout, /en/ included.
      - name: Collect the website into dist/
        run: |
          python3 scripts/stage-site.py --surface pages
          python3 scripts/stage-site.py --surface pages --check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
