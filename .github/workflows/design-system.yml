name: Design system checks

# The design system's self-checks, run rather than merely documented.
#
# foundations/layout.html publishes a table of who uses each rung of the space
# scale, stamped with a digest so a reader can tell a current table from a stale
# one. The stamp worked and the table drifted anyway, because nothing ran it.
# This is the thing that runs it.
#
# The gradient check is here for the same reason and after the same failure.
# tokens.css states the light family's one SVG convention — a waypoint at 19 %
# of the lime leg — and twenty gradients kept it while four on one page did not.
# It reads the three shipping stylesheets too, for the family's two CSS
# conventions: the arc waypoints, recomputed from OKLCh rather than compared
# against the four hexes that ship, and the rule that a ramp with a lime leg
# exists somewhere on the oklab path. The second had already been broken, by
# one declaration, silently, for as long as that declaration existed.
#
# The isometric-assembly check is the same shape one step out: foundations/
# motion.html and the README both state the assembly's invariants, and the
# README's own section on them is called "four things that vanish quietly". A
# value that vanishes without anything rendering wrong is exactly what a
# checker is for.
#
# The glass budget is the fourth and the same shape again. backdrop-filter is
# the most expensive thing in the stylesheet, foundations/materials.html states
# what keeps it affordable in prose, and every one of those rules is invisible
# in a screenshot: a third blurred layer renders correctly and just costs.
#
# The grid tracks are the fifth, and the one whose failure is visible — just not
# on a day anyone looks. base.css warns twice, in prose, that a bare `fr` floors
# at min-content and lets one long word push the page sideways; thirty-two of
# thirty-three fr track lists carried a minimum and .cf-progress did not. It renders
# perfectly until a compound noun is long enough, and then it scrolls sideways
# at 320 px on a page nobody re-tested.
#
# The breakpoint register is the sixth, and the one with the most evidence
# behind it. A threshold cannot be a token — var() is not allowed in a query
# prelude — so every one is a literal, and the register is the list. Kept by
# hand it was caught short four separate times, and each fix ended by telling
# the next person to grep the preludes and not trust the last sweep. They did,
# and it was short again. Four times is enough evidence about the instruction.
#
# The overflow crops are the seventh, and the one whose failure is invisible on
# every day. `overflow: hidden` crops, which is what anyone writing it wants,
# and makes a scroll container, which almost nobody does — and the second half
# renders identically to the first. It cost this system a view timeline that
# reported live and never moved, and a prototype that sat 128 px scrollable
# sideways behind a declaration that had never cropped anything. `clip` crops
# without the scrollport; the rule is that a crop says so.
#
# The highlight fill is the eighth, and its failure was visible all along.
# -webkit-text-fill-color is inherited and beats a descendant's color, so under
# background-clip:text a highlight that states only a colour paints its plate
# and no word. .text-foil and .cf-btn--solid each carried a hand-written
# ::selection rule working around exactly that; the found state never got one,
# and the CURRENT MATCH — the rung this brand is named after — rendered as an
# empty lime block inside every foil headline and every solid button on the
# site. Two copies of a workaround is the shape of a rule that wants a script.
#
# The line types are the ninth, and the one that had been broken on a designed
# page the whole time. The CSS side of this rule has always reached the tokens;
# the markup side cannot, because a dasharray in an inline SVG is a literal
# typed next to the path data and usually carried over from an export. Counted,
# the tree shipped eight distinct dash patterns for a rule that has three -- and
# a 3 px dash period and a 5 px dash period are the same picture at a glance.
#
# The links are the tenth, and the first about the system as a site rather than
# about a drawing in it. There is no build step and no router: deploy.yml
# uploads the repository root and Pages serves it, and with no CNAME the
# document root is /control-f-website/, not the domain root. So `/expertise`
# never meant "the expertise page" -- it meant a URL one level above anything
# this repository publishes, unfixable by adding a page because there is no
# page to add it at. Every pattern page carried a nav, a footer and a consent
# banner written in production routes, and on the host that actually serves
# them all 241 were dead. The section that exists to prove the system can be
# walked was the one section you could not walk, and nothing said so, because
# a dead link renders exactly like a live one until someone clicks it.
#
# The job posting is the eleventh, and the only one whose subject is never
# rendered at all. components/vacancy.html states that the JobPosting block
# goes on the page describing one opening, that it may not go on the register
# that lists several, and that every field in it has to match what the reader
# sees. A screenshot cannot show any of that: the block is invisible, and a
# posting whose validThrough was extended on the visible page and not in the
# JSON-LD looks exactly like one that was extended in both. The consumer is a
# search engine, the failure mode is a manual action against the site, and
# nobody finds out by looking.
#
# The accessibility facts are the twelfth, and the second about the system as a
# site rather than about a drawing in it. Most of accessibility needs a browser
# or a person; some of it is arithmetic — an id is on the page or it is not, a
# heading level is one more than the last or it is two more, an <img> carries
# alt or it carries nothing — and arithmetic has the same failure shape as the
# eleven above: the page renders identically either way. The pattern pages
# declare lang="de" and the landing page's h1 is three English sentences, so
# the site's tagline, the first line a screen reader announces, was spoken in
# German phonemes — not an accent, a word the listener cannot resolve. Two
# dozen more English runs were on five other pages. Twenty-five marks, not one
# of them visible in a screenshot, and nothing in the tree could see them.
#
# The class provenance is the thirteenth, and the one that asks the question the
# other twelve assume an answer to: who declares this class. Every check above
# reads the stylesheets; none of them checks that the markup and the
# stylesheets are talking about the same thing. Counted, 27 class uses in the
# tree resolve to nobody at all — a name for a rule that was deleted out from
# under it, a modifier that was always inert, a .h1 that exists in no file in
# this repository — and each one renders exactly like a class that works. It
# also closes the last gap in the spacing and colour rules: every check in
# this directory reads tokens.css, base.css and components.css, and every one
# of them says page-local <style> blocks are out of scope, which made those
# blocks the one place in the tree a hex could sit unchallenged.
#
# The viewport is the fourteenth, and the one whose failure no measurement in
# this repository can see. foundations/mobile.html states twice that every page
# carries width=device-width, initial-scale=1 and nothing that pins the scale,
# because pinch zoom is how a large share of people read on a phone at all. A
# page that revokes it renders identically at every width, on every machine a
# designer owns, in every screenshot, and in the responsive lane's own numbers:
# scrollWidth unchanged, nothing overflowing, no console error. A desktop
# browser ignores the directive outright, so it cannot be caught by looking. It
# is visible only to someone holding a phone who needs the text bigger and finds
# it will not move, and that person is not in the review. The accessibility
# facts above are arithmetic about what the page says; this one is about a
# control the reader owns, and the page taking it away.
#
# The page-local thresholds are the fifteenth, and the register in tokens.css
# names their scope as the thing it leaves out: "inline <style> — per-page demo
# styles". That exclusion is right, because governing documentation chrome from
# a shipping stylesheet's register would make it look like it governed the
# chrome. It also left those thresholds registered nowhere, and a threshold
# registered nowhere is a number the next person reasoning about where this
# system folds will not find.
#
# The gap had a live bug in it for as long as it existed. patterns/expertise
# .html gated its pinned scroll stage on (min-width: 820px), the number
# prototypes/expertise-scroll.html asks, carried into patterns/ with the
# mechanism -- while patterns/landing-page.html runs the same mechanism on
# (min-width: 64rem) and (min-height: 45rem), measured for it. The stage is only
# habitable once .ex-step has its two columns, and that fold is a CONTAINER
# query at 56rem, so a px gate cannot track it: the pin arrived at a fixed 820
# while the columns arrived wherever 56rem of container landed, and between the
# two the stage pinned a stacked step into 100vh of `overflow: clip` and cropped
# it -- 84 px at a 16 px default font, 173 at 20, 297 at 24. The band grows with
# the reader's type while the gate stands still, and none of it shows at 375,
# 768 or 1280, which are the three widths anyone checks.
#
# The registration is the sixteenth, and the third about the system as a site.
# design-system/index.html is the only enumeration of the Patterns section —
# no build step generates a listing, no page in the section links all of its
# siblings — so a pattern page whose .docs-card is missing is not late
# documentation, it is unreachable: it ships, renders perfectly at its
# address, and nobody who does not already know the address can arrive at it.
# The build lane's rule says "a page nothing links to is not shipped";
# check-links.py guards the opposite direction (a card pointing at a missing
# file), and until this check the direction that decides whether a page exists
# for a reader had no guard, because an absent card photographs as nothing.
#
# The error contract is the seventeenth, and the first whose subject is a
# component's own stated rules rather than a stylesheet's. components/
# error-state.html writes three countable clauses in prose — the inline
# variant's title is never an <h1>, a routes list is three to five rows, and
# the list does not repeat what the primary button already offers — and every
# one of them breaks without changing a pixel, because the title's size comes
# from the class and not the tag, a two-row list is still a list, and a
# duplicated exit is still an exit. The clauses were kept by the one page that
# rendered the block; the moment a second page rendered it, they were kept by
# two, by hand.
#
# The contrast register is the eighteenth, and the one whose subject already
# shows its work. tokens.css derives that 46 % white glass over a pure black
# video frame renders rgb(117,117,117) and clears WCAG AA by 1.3 %, warns that
# 0.45 renders two integers lower and fails at 4.43:1, and closes "raise it or
# leave it" — and then nothing ran the derivation again. Thirteen ratios the
# shipping pages rest on were each computed by a person once, on the day the
# value was chosen, and the difference between the tightest of them holding
# and failing is below what any reviewer can see in a screenshot. The check
# recomputes all of them from the live token values, composited and quantized
# the way the browser paints them, and holds the four documented users of
# --text-muted to a register so the color that measures 2.0:1 on the page
# wash cannot quietly gain a fifth.
#
# The section counts are the nineteenth, and the only one whose subject a
# reader could check by looking — if anything ever told them to look.
# components/section-header.html calls the header "the smallest and most
# important element in the system" and publishes four forms for the number on
# its right; the landing page shipped five counters and four were false. "10"
# stood over four faces, "189 Beiträge" over eighteen cards, "03 / 06" over
# seven logo marks, and "01 / 04" over the one section that carries its own
# LIVE position in .cf-pin__index — wrong for three of the four quarters the
# reader scrubs through. Every one of them renders exactly like a true one:
# 11 px of mono at the far end of a hairline, which no screenshot, no contrast
# check and no validator has an opinion about. This one counts what stands
# under the header and holds the counter to it.
#
# The pinned measure is the twentieth, and the one that was wrong only on the
# shapes nobody screenshots. .cf-pin's stage is three rows — an index that
# names the card, the card, a bar that runs under it — and they are one column
# or the index is annotating the wash beside it. The landing page binds its
# card's WIDTH to the viewport HEIGHT, correctly and with the derivation in
# place, because the card is half its width high and that is what makes it fit
# one screen; and it wrote that cap on the card alone. So the chrome ran wider
# than the card by 115 px at 1280 x 720, 96 at 1366 x 768, 132 at 1512 x 782
# and 256 at 1440 x 720 — and by exactly 0 at 1024 x 900, 1280 x 900, 1440 x 900
# and 1920 x 1080, because the cap only binds on a viewport that is wide for its
# height. Every number in the first list is a laptop and every one in the second
# is a height a person checks at, including both edges of the stage's own gate.
# The fix moves the cap to a custom property on the stage, inherited by all
# three rows, so a page cannot narrow one of them; this runs that.
#
# The overflow-wrap net is the twenty-first, and the one whose subject the
# manual had already declared handled. base.css sets overflow-wrap on the
# text-bearing elements and foundations/layout.html says, in a note about a
# different bug, that "the reset sets it on everything" — so anyone reading
# either file learns that a German compound cannot escape its box. The list was
# written by hand and is a list of the elements that MEAN text; four tags on
# the pattern pages hold copy and were not in it. Two were live on the landing
# page at a 16 px default, with no enlarged type needed: one real compound in a
# FAQ question or in a section counter took the document from 320 to 384 px.
# The floor is what stops that (see the grid tracks above, and note that
# neither of these two was a grid at all — one was a flex row and one an
# ANONYMOUS flex item, which is the one kind nothing can put min-width: 0 on);
# the net is what makes the row read afterwards instead of painting 322 px of
# word through a 280 px row. Both halves ship here, and the check keeps the
# hand-written half from being caught short again.
#
# The arrival is the twenty-second, and the first whose subject is the scroll
# rather than anything drawn on it. components/article.html states in prose
# that headings carry scroll-margin-top for the sticky navigation, "without it
# an anchor lands underneath the bar", and one rule kept it: .cf-prose
# :is(h2, h3, h4), written for the prose track. The other 38 addressable
# headings in the tree had nothing, and 33 of those are the section header's
# label — the <h2> of every section of every designed page. The bar is 84 px
# and that label's box is 16, so the heading a reader asked for did not land
# low, it landed entirely inside the band: on the landing page, loading the
# address with the fragment already in it, #prozess, #partner, #faq and #blog
# each put 16 px of 16 behind the navigation. Nothing renders wrong
# afterwards. The page is merely somewhere else, and the reader assumes they
# mis-remembered the anchor.
#
# The same check holds the one motion on this site that never asked. Every
# animation in the three stylesheets is gated on prefers-reduced-motion:
# no-preference — every view timeline, every keyframe, every transition — and
# `html { scroll-behavior: smooth }` in base.css sat outside all of it. It is
# also the largest: the smooth scroll from the top of the landing page to the
# team strip travels 6030 px, measured. And it fires far more often than the
# anchors it was written for, because Chromium scrolls a focused element into
# view — on a page this tall every Tab to an off-screen control is one of these
# journeys. Reading the focused element 45 ms after each Tab, 34 of the landing
# page's 47 stops were still in flight under the default and 0 of 46 are under
# `reduce`. Which handed the largest dose of the one unasked motion to the
# readers navigating by keyboard, the population the preference exists for.
#
# The edge strokes are the twenty-third, and the one whose subject is half of
# a line that was never painted. A stroke is centred on its path and an <svg>
# clips at its own viewport, so a rail written ON the boundary of its viewBox
# loses its outer half — silently, because what remains is a hairline in the
# right place in the right colour, just thin. components.css has answered this
# three times, on .cf-page-header__figure, .cf-plot__draw and
# .cf-arrive__object, and exactly one of the three says why: "The viewBox is
# the drawing's bounding box, so a 1 px non-scaling contour at the extremes is
# half outside it." One comment, three hand-kept copies — and the fourth
# drawing to need it did not have it. .lp-frame, whose whole geometry sits on
# its extremes, shipped four rails at 0.48 - 0.52 px against an interior
# divider at 1.00, redistributed on every resize because the clip snaps to the
# device grid, and at both T-junctions a whole divider met a half rail. That
# fix landed an hour before this check; what did not land was anything to stop
# the fifth. The rule counted here is the narrow, provable half: a straight
# stroked segment with BOTH endpoints on the SAME viewBox edge is coincident
# with the boundary rather than merely touching it, and loses exactly half of
# itself by construction. Merely touching stays out — a drawing running out of
# its frame is a deliberate crop, and this system is full of them.
#
# The pinned handover is the twenty-fourth, and the only one whose subject is
# wrong in no single frame. It is also the only one whose rule the system had
# already written down and then lost in a move. Unsere Werte, the first of the
# three pinned tracks, has carried it since it was written — its sixth stage
# runs cf-values-item-last instead of the animation that ends at opacity 0,
# under the comment "the last one holds: there is no seventh stage to hand over
# to" — and foundations/motion.html#hold states it a second time about
# Expertise's glass pane. Then the landing page's and Expertise's byte-identical
# private copies of the scaffolding were folded into .cf-pin, and the quarters,
# the crossfade, the 62 % hold and the chrome all came across while the
# last-stage exception did not, because neither page's copy had ever had it. So
# all three animations that carry a .cf-pin stage are handover animations, each
# authored to come back to nothing at 100 % so the next quarter can take the
# stage, and all three were handed to the fourth quarter, which has no next
# quarter. Both tracks therefore took themselves apart at the end and then made
# the reader scroll the wreckage: on the landing page at 1440 x 900 the last
# card's copy left at contain 96.5 %, its index number greyed out under it by
# 100 %, the drawing dissolved by 103.5 %, and 700 px of empty lectern, four
# dead numbers and a full progress bar scrolled past with nothing on the page
# changing at all. Every frame of that renders exactly as authored; it is only
# wrong as a sequence, at the one end of a 6,660 px track that a reviewer
# reaches last. The check holds all three tracks — Werte included, so the place
# this was learned is held to it too — to base keyframes that still hand over
# and last stages that end standing on the same arrival literal, plus the two
# things that will silently break: the markup shape `:last-child` is standing
# on, and the count Werte's `:nth-child(6)` ending is bound to instead.
#
# The hero video is the twenty-fifth, and the second whose subject is a cost
# rather than a picture — the glass budget is the other. components.css opens
# the hero's reduced-motion block by naming the cost it knew about, that
# `display: none` does not pause the element so decoding continues. It named
# the decode; the download was the larger half and nothing named it, because
# `display: none` is a rendering instruction and the resource selection
# algorithm has never read one. Measured on the landing page, the transfer was
# byte-identical with the preference set and unset — 1,890,957 total, of which
# 995,398 was the mp4 — for a reader whose own OS setting says they will not be
# shown a frame of it. 53 % of the page, spent on the one reader who asked for
# less. `preload="none"` looks like the fix and is not: autoplay overrides it,
# measured, and the file was still requested in both states. A <source> with a
# media attribute is, because that is the selection algorithm rather than a
# hint to it. Every symptom is on the wrong machine — the still appears either
# way, no console message, no failed request — so the only thing that shows it
# is a byte count, which is what a checker can hold and a screenshot cannot.
#
# The label ramp is the twenty-sixth, and the first whose subject is type size.
# base.css calls .t-label "the single most recognisable text style in the
# brand" and tokens.css writes 11 px into the token itself — "mono labels only,
# never prose". Counted, 55 rules in the tree set mono AND uppercase and 54 of
# them take that ramp: 50 at --text-xs and three at --text-sm, which is the one
# deliberate step above it and has a NAME (.t-label-lg). The fifty-fifth was
# the landing page's partner wall, whose own <style> block restated four of
# .t-label's five declarations by hand and set the fifth to --text-lg. That is
# how a hand-copied utility fails: not all at once, and never visibly on its
# own line. It made the one ghosted placeholder on the page the largest mono
# uppercase run in the system — 45 % larger than the <h2> standing on the
# hairline directly above it, so the section's loudest type was the part of it
# nobody is meant to read — and no check in this directory reads a font size at
# all, so nothing in the tree could say so.
#
# The reset shadow is the twenty-seventh, and the only one whose subject is a
# declaration that was never applied at all. base.css resets
# `ul[role="list"], ol[role="list"]` — (0,1,1), because an attribute selector
# weighs what a class weighs — so every single-class rule that sets margin,
# padding or list-style on one of those lists loses, in every stylesheet, at
# every source position, forever. Nothing shows: the property is spelled
# correctly, the class is on the element, the rule is the last one written, and
# it computes to the reset's value as though the line were not there.
# components.css's .cf-pin__inner note already records one occurrence and draws
# the lesson from it in as many words — "margin-inline: auto here is (0,1,0) and
# base.css writes ol[role='list'] { margin: 0 } at (0,1,1)" — and then the
# landing page shipped the same bug one property over on the same <ol>, and
# .cf-pagination__list shipped it one component over on the property the note
# names. A comment on one selector cannot see the next selector. Counted, the
# tree carried 33 shadowed declarations: 30 restate the reset and are harmless,
# and the three that contradict it were all live. The nav plate's 8 px inset
# computed to 0 px on every page in the system, with the pills flush against its
# border; the pagination's auto margin — the one its own comment exists to
# justify, "without a status line there is only one flex child, and
# space-between would park it on the left" — computed to 0 px and parked it on
# the left; the info card's chips sat flush under their label. This one weighs
# every rule in the tree against every attribute-bearing reset in base.css and
# fails only on the ones asking for something the reset denies.

#
# The focus ring is the twenty-eighth, and the second whose subject is a
# hand-written list in base.css that was caught short by the same element as
# the first. The overflow-wrap net (the twenty-first, above) was a list of the
# elements that MEAN text rather than of the elements that HOLD it; eleven
# lines further down the same file, the focus rule named a list of the things a
# person thinks of as controls rather than of the things the browser gives
# focus to. <summary> is focusable in every engine, is none of the five tags
# named, and carries no tabindex — so the system's ONE focus indicator, the
# declaration behind every ring on every page, had never once reached a
# disclosure. Twenty-one of them in six files, six of them the landing page's
# FAQ rows.
#
# It is invisible in the way this directory keeps finding things invisible: the
# user agent draws its own ring, so a focused row photographs as a focused row.
# Measured on the landing page's first FAQ row at 1440 x 900, unfocused against
# focused — the component's sheen sweep alone changes contrast by 1.23:1, under
# the 3:1 WCAG 2.4.11 asks of an indicator; the browser's fallback outline
# alone by 13.61:1; this system's ring, once summary is in the list, by 14.91:1.
# So the whole job was being done by a ring nothing here asked for, at 1 px
# where the system draws 2, at offset 0 where it draws 2, and in the UA's
# near-black rather than in --focus-ring, the token that flips to lime under
# data-theme="inverse" and is therefore the only one that survives a dark
# surface. The check reads the rule and the markup instead of the next
# hand-kept list, and holds the ring to the token as well as the list to the
# tags — a list that covers everything and paints a literal is the same failure
# one step along.
#
# The page-local grid tracks are the thirty-first, and the whole of it is a scope
# line in the twelfth. check-grid-tracks.py opens by naming what it reads —
# "the three stylesheets that ship to control-f.de. docs.css, per-page <style>
# blocks and prototypes/ are out of scope" — which is the right boundary for
# that file and a hole in the tree. patterns/ are not documentation; they are
# the compositions, and a bare fr in one of their <style> blocks widens a track
# to the longest German compound inside it and takes the page sideways at a
# viewport nobody tested. The system already knew, in the landing page's own
# words: "the floor the pages' own copies never had: page-local blocks are
# outside check-grid-tracks.py's scope, so the bare 1fr shipped twice
# unchallenged. Folding it here is what surfaced it." Folding surfaced that
# one. Nothing was watching for the next.
#
# So the new file reads the blocks the old one cannot and applies the identical
# rule, by importing floored(), block_of() and guarded_blocks() from it rather
# than restating them — two definitions of one floor being the shape of bug
# this directory exists to catch. It fails on patterns/ and counts foundations/
# and prototypes/, the boundary tokens.css draws around its register and
# check-local-thresholds.py draws around PX DEBT. patterns/ is clean today;
# seven unfloored track lists live in the other two, printed every run so they
# are a number somebody can act on rather than a hole nobody can see.
#
# The build arrival is the thirty-second, and the one this directory has now had
# to be told three times. foundations/motion.html stated the rule backwards, in
# as many words — "everything is finished by the time the object reaches the
# middle of the viewport ... the last range ends at cover 50 %, which is exactly
# that moment" — and every number in it was right. A cover range spans vh + h and
# the element is centred at (h + vh) / 2 into it, so both heights cancel and the
# centred moment is cover 50 % at every viewport: "ends by 50" and "is over
# before anybody looks at it" are the same sentence. The designer met a finished
# drawing twice and said so twice; the ranges were retimed twice, by hand, and
# nothing held them.
#
# What makes it a check rather than a third retime is that neither retime could
# have been trusted anyway. The state that matters is the RENDERED one — these
# animations carry --ease-out, so a figure two thirds through its window reads
# 78 % built — and the measure has to be INK, each stroke weighted by its own
# length, because a mean over parts is a different quantity every time the
# drawing is redrawn. The landing page's flow went from ten strokes to
# thirty-seven in an ordinary correct change, and the envelope it inherited went
# from 67 % of its ink at the centred moment to 78 % while its part mean barely
# moved. The script resolves the cubic-bezier out of tokens.css and the lengths
# out of the markup's own `d`, so both halves are computed rather than recorded.
# The hero scrim is the thirty-fifth, and the first whose subject a check in
# this directory already tried and could not reach. check-contrast.py
# recomputes every pair the token file's guarantees rest on; it cannot
# recompute this one, because the backdrop is not a colour but twelve seconds
# of H.264, and a contrast figure taken over a video is a figure taken over one
# frame unless somebody decodes all three hundred and sixty. Nobody had.
# tokens.css published "headline 4.08–6.26:1" over 375 / 768 / 1280 / 1920 and
# priced the risk it was carrying at "about 36 % over its floor"; decoded, the
# loop's own worst frame reads 3.28 / 3.15 / 3.51 / 3.41 / 2.91, and 1.65 at
# 2560. Two of those are under the 3:1 WCAG 1.4.3 sets for large text, and the
# published figure at 1920 was wrong by a factor of 2.15. The sample had been
# taken on frame 61 — which is hero-poster.jpg, the only frame a browser will
# hand you with the loop paused, and therefore the only one anybody was ever
# going to measure.
#
# The fault is geometry and not weight, which is the part a script can hold.
# The scrim's plateau was a constant, chosen on the premise that "the column is
# anchored to the left gutter … so it stays about the same size while the line
# grows". True to 1438.2 and false above it: past --container-max the container
# centres and the column slides right by half of every further pixel — the fact
# --column-inset exists to carry, in its own words, "80 px at the 1440 frame,
# 240 at 1920, 560 at 2560" — so the headline's far corner walks out past twice
# the plateau, where the scrim is not weak but zero. The hero's CTA and its
# pause switch already take --column-inset; the scrim was the third full-bleed
# layer that has to line up with the column and the one that did not.
#
# So the photometry stays in the comment as a dated measurement and the
# ARITHMETIC it was taken under is what runs here: the reach still carries the
# column's displacement, spelled with the tokens rather than the lengths they
# hold today; its coefficient is still sin(--angle-a), recomputed rather than
# compared against the literal that ships; and the weight has not been nudged
# below the value the table was measured at. A guarantee whose evidence costs a
# decoder and 360 screenshots per viewport to reproduce is exactly the kind
# that gets invalidated by a one-line change four screens away — which is how
# the figures this replaced came to be wrong in the first place.
#
# The hero contrast is the thirty-sixth and the other half of that pair. The
# check above holds the scrim's geometry and stops there on purpose; this one
# carries the photometry, reduced to the only thing the arithmetic needs, and
# recomputes the ratios themselves. What it caught is the axis the geometry
# check cannot have: its register is widths, correctly — "heights are
# irrelevant to the reach" — but they are not irrelevant to the ARTWORK.
# .cf-hero__media covers with a 1080 px square, so which part of that square
# lands under the type is decided by the box's ASPECT. Sampled at frames rather
# than widths, the 11 px kicker read 4.03:1 at 375 x 812 and 4.37:1 at 768 x 800
# against a 4.5:1 floor the width-only table put at 6.08 and above — nine
# failing frames, the poster among them, so it failed before a frame of the loop
# had decoded and for the reduced-motion reader who is shown nothing else.
#
# The cliff is 56.25rem, where .cf-hero__action leaves the flow and the media
# box goes from 567 px tall to 624: 4.15:1 at 900 x 800 and 13.25:1 at
# 1024 x 768, a factor of three across 124 px with nothing gradual between. So
# --scrim-depth is 0.5 at and below that threshold and 0.42 above it, and the
# check recomputes every ratio from the tokens: the angle, the reach with its
# column term and the gutter's own clamp, both depths, the scrim's colour, and
# --hero-dissolve, which masks the ::after along with the artwork under it. Each
# row carries its sample points' Pareto frontier rather than one pixel, because
# the worst COMPOSITED pixel is not the darkest and which one binds depends on
# the very number a person retuning this would be changing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # One job, not forty. All forty checks are a few hundred
  # milliseconds of stdlib python; a second runner would cost more to start
  # than any of them takes to run, and a reader looking at a red tick wants
  # every answer on one page.
  self-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-python step and no dependencies on purpose. The scripts are
      # stdlib only, and ubuntu-latest ships python3 — the system has no build
      # step and these checks do not give it one.
      - name: Spacing scale
        run: python3 scripts/check-spacing-scale.py

      # Each check runs even when an earlier one has already failed: forty
      # independent facts about the same commit are more useful than the first
      # one.
      - name: Gradient family
        if: '!cancelled()'
        run: python3 scripts/check-gradient-family.py

      - name: Isometric assembly
        if: '!cancelled()'
        run: python3 scripts/check-iso-motion.py

      - name: Glass budget
        if: '!cancelled()'
        run: python3 scripts/check-glass-budget.py

      - name: Grid tracks
        if: '!cancelled()'
        run: python3 scripts/check-grid-tracks.py

      - name: Breakpoint register
        if: '!cancelled()'
        run: python3 scripts/check-breakpoints.py
      - name: Overflow crops
        if: '!cancelled()'
        run: python3 scripts/check-overflow-clip.py

      - name: Highlight fill
        if: '!cancelled()'
        run: python3 scripts/check-highlight-fill.py

      - name: Line types
        if: '!cancelled()'
        run: python3 scripts/check-line-types.py

      - name: Links
        if: '!cancelled()'
        run: python3 scripts/check-links.py

      - name: Job postings
        if: '!cancelled()'
        run: python3 scripts/check-job-posting.py

      - name: Accessibility facts
        if: '!cancelled()'
        run: python3 scripts/check-a11y.py

      - name: Class provenance
        if: '!cancelled()'
        run: python3 scripts/check-class-provenance.py

      - name: Viewport zoom
        if: '!cancelled()'
        run: python3 scripts/check-viewport-zoom.py

      - name: Local thresholds
        if: '!cancelled()'
        run: python3 scripts/check-local-thresholds.py

      - name: Pattern registration
        if: '!cancelled()'
        run: python3 scripts/check-registered.py

      - name: Error contract
        if: '!cancelled()'
        run: python3 scripts/check-error-contract.py

      - name: Contrast register
        if: '!cancelled()'
        run: python3 scripts/check-contrast.py

      - name: Section counts
        if: '!cancelled()'
        run: python3 scripts/check-section-counts.py

      - name: Pinned measure
        if: '!cancelled()'
        run: python3 scripts/check-pin-measure.py

      - name: Overflow-wrap net
        if: '!cancelled()'
        run: python3 scripts/check-wrap-net.py

      - name: Arrival
        if: '!cancelled()'
        run: python3 scripts/check-arrival.py

      - name: Edge strokes
        if: '!cancelled()'
        run: python3 scripts/check-edge-stroke-clip.py

      - name: Pinned handover
        if: '!cancelled()'
        run: python3 scripts/check-pin-handover.py

      - name: Hero video weight
        if: '!cancelled()'
        run: python3 scripts/check-hero-video.py

      - name: Label ramp
        if: '!cancelled()'
        run: python3 scripts/check-label-ramp.py

      - name: Reset shadow
        if: '!cancelled()'
        run: python3 scripts/check-reset-shadow.py

      - name: Focus ring
        if: '!cancelled()'
        run: python3 scripts/check-focus-ring.py

      - name: Skip target
        if: '!cancelled()'
        run: python3 scripts/check-skip-target.py

      - name: Consent clearance
        if: '!cancelled()'
        run: python3 scripts/check-consent-clearance.py

      - name: Flow terminals
        if: '!cancelled()'
        run: python3 scripts/check-flow-terminals.py

      - name: Flow values
        if: '!cancelled()'
        run: python3 scripts/check-flow-values.py

      # The forty-third, and the other half of the sentence Flow terminals has
      # been saying alone. That one proves every terminal ARRIVES; nothing
      # proved what a stroke does BETWEEN its terminals, and three of the
      # grown branches walked straight over another branch — (600, 550),
      # (195, 555) and (653.33, 478.33), none with a node on it, because a
      # crossing is not a junction and cannot carry one. In a construction
      # drawing two lines crossing with nothing on the crossing MEANS "not
      # connected", so a drawing whose subject is data merging was denying it
      # in three places, in its own vocabulary. It was in every screenshot of
      # the section and had never been read as a failure. The node ladder
      # rides along, for the same class of error one level up: three nodes at
      # --l 1.5 — the same run from the void, to the unit — carried r 2, r 1
      # and r 1, under a rule whose only variable is distance.
      - name: Flow crossings
        if: '!cancelled()'
        run: python3 scripts/check-flow-crossings.py

      # The thirty-eighth, and the third on the same drawing. Flow terminals
      # holds every stroke to a brand angle and every terminal to an arrival;
      # a root can satisfy both completely and still be a bus down one side.
      # The right taproot crossed 250 units of width in one step with no
      # junction on it, so the growth rule had nothing to grow from and the
      # band it crossed carried 6.1 % of the drawing's stroke against an even
      # sixth of 16.7 %. Every existing check passed on it, the generator's own
      # assertions passed on it, and the markup carried the rule it broke in
      # prose. The walls are exempt — a root thins where it arrives — and the
      # floor is on the four interior bands, where a hole is a hole.
      - name: Flow density
        if: '!cancelled()'
        run: python3 scripts/check-flow-density.py

      - name: Page-local grid tracks
        if: '!cancelled()'
        run: python3 scripts/check-page-local-tracks.py

      - name: Build arrival
        if: '!cancelled()'
        run: python3 scripts/check-build-arrival.py

      # The thirty-second, and the pair to Flow terminals above. That one
      # proves no stroke in the flow ends in mid-air INSIDE its own viewBox;
      # this proves the drawing the flow hands over to is laid out on the box
      # the flow lands on. Both were true of the same six hairlines, and the
      # contour still stood 1 px inside the border it replaced at every
      # viewport, because `inset: 0` is measured from the padding box and
      # giving up border-color does not give up border-width.
      - name: Contour box
        if: '!cancelled()'
        run: python3 scripts/check-contour-box.py
      - name: Hero scrim geometry
        if: '!cancelled()'
        run: python3 scripts/check-hero-scrim.py

      - name: Hero contrast
        if: '!cancelled()'
        run: python3 scripts/check-hero-contrast.py

      # The thirty-fourth, and the third of the same set. Flow terminals holds
      # the root to "no free ends" inside its own viewBox; Contour box puts the
      # lectern's drawing on the box the flow lands on; neither can see the
      # seam BETWEEN the two drawings, which is the one thing at this join that
      # has been kept in prose and fixed by hand three times running — #176,
      # #177 and #178, each found by looking at a screenshot. The two viewBoxes
      # share a width basis because --lp-measure is declared once and read by
      # both, so the correspondence the markup states in words — "flow x 0, 600
      # and 1200 are these x 0, 500 and 1000" — is arithmetic, and arithmetic
      # is checkable. It holds the lectern closed, every drop inside the top
      # rail's span, and every vertical growing from a point a drop reached.
      - name: Flow handover
        if: '!cancelled()'
        run: python3 scripts/check-flow-handover.py

      # The fourth of that set, and the one that says the other three are all
      # measured at the same instant. Flow terminals, Contour box and Flow
      # handover each read the seam at one scroll position, and every number
      # they publish — including the nine-row table the craft lane was handed —
      # is taken before the pin engages. .lp-frame sits inside .cf-pin__stage,
      # which is sticky; .lp-flow sits in static flow one section up. The
      # moment the stage sticks the frame holds against the viewport and the
      # flow does not, so at 1440 x 900 — the one size the table records the
      # seam as MADE at, 1.58 px — the gap is 60.70 px sixty pixels of scroll
      # later and 160.70 px with both ends still on screen. Sixteen terminals
      # hanging in wash above the rail they are drawn to arrive on, which is
      # the picture #176 was opened for. The rate is not a measurement: a held
      # layer and a travelling one separate by exactly the scroll delta, so
      # this derives the asymmetry from the markup and the stylesheets and
      # holds the note to the 1.00 px per px it forces.
      - name: Seam travel
        if: '!cancelled()'
        run: python3 scripts/check-seam-travel.py

      # The thirty-fifth, and the first whose subject is not a state the page
      # reaches but the RATE at which it reaches it. Every animation here is
      # driven by scroll range rather than by a duration, so the reader's hand
      # is the transport and "how far a part moves per pixel of scroll" is a
      # real, authored quantity that nothing had ever been held to. One exit
      # was thirteen times over everything else on the page — the statement's
      # scatter, which restated animation-name, -range and -fill-mode in full
      # and not animation-timing-function, and so ran a 439-unit translate in a
      # 168-unit window under a curve whose steepest slope is 5. It is a pure
      # number, not a measurement: both quantities are in the drawing's own
      # units and `exit` spans the subject's own height, so the render scale
      # cancels and the ratio is the same at every viewport.
      - name: Scrub rate
        if: '!cancelled()'
        run: python3 scripts/check-scrub-rate.py

      # The thirty-sixth. The subdivision folds in two files — base.css
      # collapses the columns, components.css hides the timeline that names
      # them — and components.css treats "the axis is a row of the same grid,
      # so it folds on the same element's width by construction" as the end of
      # the matter. Same element is half of it; it has to be the same NUMBER,
      # and nothing held it there. Move one prelude and the grid stacks into
      # one column with five vertical year ticks still drawn beneath it, a
      # timeline labelling columns that are not on the page. It renders. The
      # second pair — .subdivide--late, the fold a five-column grid needs — is
      # what turned "obviously in sync" into two things that can drift.
      - name: Subdivision fold
        if: '!cancelled()'
        run: python3 scripts/check-subdivide-fold.py
      # The fortieth, and the first about a feature that fails by not
      # failing. anchor() does not error when it cannot resolve — the
      # declaration behaves as `auto` and the element renders perfectly at its
      # STATIC position, which is a place nobody chose. Both ways of not
      # resolving were hit while placing the "Was wir machen" title on the
      # drawing's horizon: a wrapper given `position: relative` made the anchor
      # unacceptable and dropped the header 250 px, drawing a full-measure
      # hairline through the middle of the root; a misspelt dashed ident does
      # exactly the same thing and is cheaper to write. So: every reference
      # resolves, every declared anchor is used, and every use sits inside an
      # @supports that tests the feature.
      - name: Anchor positioning
        if: '!cancelled()'
        run: python3 scripts/check-anchor-positioning.py

      # The forty-first, and the last unguarded end of the root. The drawing has
      # two ends that are not junctions with itself: the fourteen at the foot,
      # which check-flow-handover.py holds, and the one at the head, which
      # nothing held. check-flow-terminals.py DEFINES the void as whatever the
      # topmost start happens to be — `void = tops[0]` — so the trunk could
      # depart a hundred units below the ring, in open wash, and every check
      # would pass. The real relationship was kept in prose, and the prose had
      # the ring at "about 88 flow units" against markup that draws it at 84;
      # 88 x (1280/1200) = 93.87 is where the "94 px rim" in a second note came
      # from, and the conclusion drawn from it was backwards. What is actually
      # true is exact: both drawings are 1200 units over the same page width, so
      # 84 == 84 puts the departure ON the rim, and that is now arithmetic
      # rather than a sentence.
      - name: Void departure
        if: '!cancelled()'
        run: python3 scripts/check-void-departure.py

      # The forty-second, and the second in a row about a declaration that never
      # applied. Nothing on this page is drawn with a dash — a dashed draw under
      # non-scaling-stroke stops at the render scale — so every stroke grows by
      # `scale: 0 -> 1` and takes its whole direction from transform-origin. The
      # end each one grows from is authored per stroke as --o, read by one class
      # rule at (0,1,0), and the shared element selector six lines above it said
      # `transform-origin: 0 0` at (0,1,1). Five of the lectern's six strokes ask
      # for 0 0 anyway and were right by coincidence; the sixth is the top rail's
      # left arm, whose parent junction is the middle vertical, and it grew out
      # of the far corner instead — closing on the trunk's landing point last,
      # for as long as the drawing has existed. The note directly above the rule
      # had already worked out that (0,1,1) beats (0,1,0) and warned about the
      # animation shorthand, one line over. Both ends of the draw render
      # identically either way, which is why no screenshot ever caught it. So the
      # cascade is resolved rather than read: for every element carrying a --o,
      # the declaration that wins must be the one that reads it.
      - name: Grow origin
        if: '!cancelled()'
        run: python3 scripts/check-grow-origin.py

      # The forty-fourth. The hero's one control — the switch WCAG 2.2.2
      # requires over a 12 s loop that repeats forever — lived inside
      # .cf-hero__media, which is a stacking context on purpose: it is what
      # keeps the artwork and the scrim under the type without the type having
      # to state an order. It kept the control under the type too. The plate's
      # own z-index ranked it against the video and the scrim and nothing
      # else, so at 375 x 812, where the hero runs short and the headline
      # climbs into the plate's band, all three hit-test points on the plate
      # returned h1.cf-hero__title. Every pixel of the broken state is
      # identical to the fixed one — the plate is drawn, the hover fires, the
      # focus ring paints, and the checkbox still worked from the keyboard.
      # Only a hit test could tell them apart, which is what this computes:
      # for every control that floats, what actually ranks for it, and whether
      # any content it can overlap ranks at or above that.
      - name: Pointer reach
        if: '!cancelled()'
        run: python3 scripts/check-pointer-reach.py

      # The forty-fifth, and check-pin-handover.py read from the other end. That
      # one holds the tail of a pinned track: the last quarter has no exit,
      # because there is no next quarter to hand over to. This holds the head:
      # a quarter does not open on a still. The plate crosses in and lands at
      # contain 0.41 % of its quarter, and something has to be moving by then —
      # on a pinned stage the reader's wheel moves nothing else, so a gap
      # between the plate landing and the first part starting is the one still
      # on a scrubbed page that reads as a fault and not as a hold.
      #
      # It broke the way these break. The landing page's build head is 1.5
      # because the ghosts open a quarter at 0.5 and the solids arrive a point
      # later, into geometry already standing — and card 01 has no ghosts, so
      # its quarter opened by waiting a point for something that never comes.
      # 62 px at 1440 x 900 in which every animated property on the page was
      # bit-identical, at the one seam the whole page is built around: the frame
      # finished, 01 02 03 04 lit over an empty rectangle, nothing moving.
      # Every frame of it rendered exactly as authored.
      #
      # The families are read off the MARKUP rather than off the stylesheet,
      # which is the whole of why this catches it: a check that took the ghost
      # window on trust would have read 0.5 for a card that has no ghosts and
      # passed. Expertise is held to the same rule for the same reason Werte is
      # in the handover check — it shares .cf-pin, and a fix to the mechanism
      # that only ever gets verified on one of its two pages is half a fix.
      - name: Quarter opening
        if: '!cancelled()'
        run: python3 scripts/check-quarter-opening.py

      # The forty-sixth, and the first whose failure is nothing but empty room.
      # A figure box states a RATIO and the drawing centred in it states its own
      # SIZE CAP, and nothing in either rule stops the box once the drawing has
      # stopped growing: past the crossover the panel keeps three quarters of
      # every pixel the card gains while the object inside it stays 352 x 352.
      # On the landing page's stacked "Was wir machen" column that was 50 px of
      # dead height at a 700 px viewport, 139 at 834 and 250 at 1000 — the four
      # cards 3 678 px tall between them where 3 125 says the same thing. No
      # overflow, no clipped drawing, no failing check, and it only reads as
      # wrong beside the same card at 375, where the drawing fills its panel.
      # The invariant is arithmetic and lives in two rules 90 lines apart, which
      # is what a script is for: the box may be exactly the drawing's cap plus
      # the air the box itself declares, border included, or it may be listed
      # as released with the reason it is released.
      - name: Figure letterbox
        if: '!cancelled()'
        run: python3 scripts/check-figure-letterbox.py

      # The forty-seventh, and the first about paper. `position: fixed` is two
      # different declarations wearing one name: on a screen it pins a box to
      # the viewport, and in paged media the viewport IS the page box, so the
      # browser repeats the same box on every sheet. CSS 2.1 §9.6.1 says so
      # outright and all three engines do it.
      #
      # .cf-consent is that box on every page in the tree — `position: fixed;
      # inset: auto 0 0 0`, opaque, on --surface-inverse, and nothing scoped it
      # to screen. landing-page.html printed to A4 on a first visit came out as
      # nine pages each carrying `794 x 253 re f` filled `0 0 0`, painted last:
      # 189.9 pt of an 842.88 pt sheet, 22.5 % of every page, over the content.
      # Pages 2 to 9 ended with 4,540 bytes of byte-identical drawing
      # operators. Page four lost "Ihr Vorteil" and the benefit line under it
      # off the middle of a process card. What the reader got was a question
      # with three unpressable buttons, reprinted nine times.
      #
      # It is invisible in every screenshot this repository takes, because
      # every screenshot is `screen`. It is exactly countable in a file. The
      # rule admits two answers — scope the rule to `screen` so print never
      # reads it, or withdraw the layer in an `@media print` block — and it
      # carries the one fixed layer no author declaration can name, the UA
      # stylesheet's `dialog:modal`.
      - name: Print artefacts
        if: '!cancelled()'
        run: python3 scripts/check-print-fixed.py
      # The forty-eighth, and the sibling of check-flow-values.py — that one
      # reads --x and --y off each numeral on the root and holds the arithmetic;
      # this reads --tx, which is the property that decides whether the numeral
      # is legible where it was put. The drawing publishes the rule itself, on
      # .lp-flow__val: "these hold 12 px off the line at every viewport the gate
      # admits". Stated once in prose, typed six times by hand.
      #
      # And the same rule applied to the copy that cannot state an offset. The
      # four step marks of .cf-pin__index are on this drawing too — not placed
      # against it, but under it, because the root overhangs the pinned stage's
      # first row — so their clearance is time past the pin rather than distance
      # from the line. It was written as `entry 92% entry 100%`, and `entry
      # 100%` IS the pin: the chrome finished arriving at the instant the
      # drawing was still lying across it. Minimum distance from a .cf-pin__mark
      # box to a .lp-flow__seg at the pin: 0.00 px at 1280x800, 1440x900 and
      # 1600x900, 2.72 px at 1366x768. Mark 01 was touched by the leftmost drop.
      #
      # The five viewports that were clear were clear for the wrong reason —
      # their flow-to-frame gap is 26 to 172 px, so the drawing never reached
      # the chrome. The four that were touched are the four where that seam is
      # TIGHT. The closer the drawing comes to landing where it should, the
      # harder it lands on the copy underneath, which is why this is a check and
      # not a note for whoever next narrows the gap.
      - name: Label clearance
        if: '!cancelled()'
        run: python3 scripts/check-label-clearance.py

      # The forty-ninth, and it is the thirty-fifth's blind spot. Scrub rate
      # holds the one part on this page allowed to outrun the reader's hand and
      # says in as many words that it does not hold the `cover` and `contain`
      # families, because their phase spans depend on the viewport. `entry` is
      # the third family, nobody held it either, and it is the one .lp-frame
      # draws in — the six hairlines that replace the pinned card's border and
      # are the whole handover between the flow above and the build inside.
      # The window was a flat twelve points for all six. Five of them are 500
      # viewBox units long and the sixth, the base rail, is 1000: it drew twice
      # the line in the same scroll, exactly 2.00x at every viewport, because
      # the ratio is a pure number and not a measurement. A relay whose premise
      # is that consecutive strokes CHAIN cannot have its last leg travel at
      # twice the speed of the five that hand over to it. The rate is one
      # constant now and every window is the stroke's own length times it —
      # which is only worth anything if the length beside each path is that
      # path's, so the `d` is parsed and --u recomputed. This page has typed a
      # wrong length beside a stroke twice before.
      - name: Relay rate
        if: '!cancelled()'
        run: python3 scripts/check-relay-rate.py

      # The fiftieth, and the first one about a viewport that CHANGES rather
      # than a viewport that is. Every responsive number in this repository has
      # been measured by standing still at a width and looking; the pinned
      # section has two shapes, and the fault is not in either of them but in
      # the instant between. At 1280 x 900 "Was wir machen" is 6901 px tall
      # above the gate and 2209 px below it, and a browser handed the reader's
      # pixel offset across that put them five sections further down the page —
      # measured at both edges, both axes, and on an iPad turned from landscape
      # to portrait, which crosses both at once.
      #
      # Scroll anchoring is the platform's own answer and it is suppressed for
      # resize-driven layout changes: tested with the stage's stickiness
      # removed, with overflow-anchor forced auto everywhere, and with it forced
      # none across the pin — scrollY identical to the baseline in all three.
      # So the cure is a file, and a file is a thing a page can quietly stop
      # loading. Both halves are countable: which pages instantiate the pinned
      # track, and which pages load the cure.
      - name: Pin gate
        if: '!cancelled()'
        run: python3 scripts/check-pin-gate.py

      # The scroll port reserves the layer fixed over its bottom edge. Chromium
      # scrolls a newly focused off-screen element into view with `nearest`
      # alignment, so every forward Tab parks its control against the viewport's
      # BOTTOM edge — which is exactly where the consent banner is fixed, at
      # 144.4 px on a desktop and 333.5 on a 375 px phone. Counted on the
      # landing page, first visit, under `reduce` so every stop is at rest: 30
      # of 45 stops at 375 and 20 of 45 at 768 had the banner returned by
      # elementFromPoint at the control's own centre. Entirely hidden, which is
      # the wording WCAG 2.2 SC 2.4.11 fails on.
      #
      # It is the fourth check here whose subject renders correctly. The banner
      # is drawn as designed and the focus ring is drawn as designed; they are
      # simply drawn in the same 144 to 334 px of screen, on the one visit the
      # banner is shown and no reviewer ever sees twice.
      - name: Scroll reserve
        if: '!cancelled()'
        run: python3 scripts/check-scroll-reserve.py

      # The fifty-second, and it is the forty-first's blind spot rather than a
      # new subject. check-flow-handover.py proves, exactly, that all fourteen
      # drops land inside the lectern's top rail — on a basis it computes from
      # the two viewBox attributes and justifies in a sentence: "both drawings
      # are the same width by construction". The construction is four CSS
      # declarations in two files, and no check read one of them. Changing the
      # middle link to `calc(var(--lp-measure) * 0.92)` moves the lectern
      # 3.38 px right and 6.75 px narrow, puts the two taproots 4.69 and 4.68 px
      # off the verticals they are drawn into and the centre drop 3.27 px off
      # the top rail's own T-junction — fourteen strokes ending beside the thing
      # they arrive on, which is the picture #176 was opened for — and the whole
      # gate stayed green, because the `d` attributes never moved. Both earlier
      # breaks at this seam, #177 and #178, were CSS-side too.
      - name: Shared measure
        if: '!cancelled()'
        run: python3 scripts/check-shared-measure.py
      # The fifty-sixth, and the only one whose subject is a constant that this
      # whole directory has been reading as a ramp. A `slice` figure's visible
      # window is `viewBox height x box ratio` viewBox units — a number with no
      # viewport anywhere in it — so a badly anchored crop is not a bug at one
      # width that a ladder sweep finds. It is the SAME wrong part of the
      # drawing at 320 px and at 1000, ten identical findings or none, with no
      # overflow, no clipped element and no threshold to fail. The one thing
      # deciding which units survive is the align keyword, a token typed once
      # beside the viewBox and defaulted far more often than chosen.
      #
      # patterns/landing-page.html's statement band is 1200 x 420 and carried
      # `xMinYMid slice` against a 5/3 stacked box: window [0, 700], at every
      # width below the 56rem fold, which is every phone and every tablet in
      # portrait. Its field is masked out at x 648, so x 648–1200 is the void —
      # 552 units, 46 % of the drawing — and the void is the subject: the claim
      # set on the band is that the sensors produce data and no answers. The
      # crop kept 52 of those 552 units, 7.4 % of the frame against the 46.0 %
      # the two-column mode gives it. The reader got a lattice running edge to
      # edge over a sentence about there being nothing there, on the flagship
      # page, and all fifty-five checks above it passed.
      #
      # So it holds the three things a crop can get wrong and re-derives all of
      # them: the subject's share of the frame, against the share the widest
      # window gives it, with the subject's own edge read out of the mask
      # gradient rather than typed here; the drawing's solid objects, re-derived
      # from their arc paths, which no window may cut — the constraint that
      # picks the RATIO once the anchor has fixed the share; and the align
      # keyword itself, held to one value across every copy of the drawing,
      # because this band exists three times in the tree and two copies of a
      # decision is the shape this repository has been forked by before.
      - name: Slice crop
        if: '!cancelled()'
        run: python3 scripts/check-slice-crop.py

      # The fifty-seventh. The flow's fourteen — sixteen, with the two corners —
      # terminals landed on the frame's rail at 1440 x 900 and nowhere else:
      # 58.17 px of empty wash at 1280 x 900, 171.58 at 1920 x 1080, the whole
      # table in the .lp-flow note. Closing it means binding the drawing's box at
      # both ends and letting the trunk absorb the difference, which authors the
      # trunk TWICE — once inside the viewBox, once as three CSS insets — and the
      # two copies are never drawn at the same time. A drifted copy is a correct
      # drawing on the tier that ships it and an unchanged one on the tier that
      # does not, which is a difference no screenshot of either contains.
      - name: Flow stem
        if: '!cancelled()'
        run: python3 scripts/check-flow-stem.py

      # The fifty-eighth, and the first about bytes rather than geometry. Most
      # images on this site are sized by their container and there is no number
      # to hold them to. Two are not: .cf-team-strip__avatar and
      # .cf-article__avatar each pin BOTH axes to a fixed length, and from that
      # declaration on, the file's own dimensions have nothing to do with what
      # is painted.
      #
      # Every one of them was being handed the 640 x 800 studio portrait. On
      # landing-page.html that was 210,928 bytes — 10.1 % of the 2,098,207 the
      # page transfers, second only to the hero loop — to paint four 56 px
      # circles covering 0.6 % of its drawn area: 512,000 source pixels each
      # for 3,136 painted ones, 163 x the area a 1 x screen can use. The same
      # portrait sat behind a 48 px byline on two more pages.
      #
      # Nothing caught it because nothing was wrong to look at. The browser
      # downsamples, the circles are sharp, every check passed and no
      # screenshot differs by a pixel. A cost that is invisible in the picture
      # and exactly countable in the file is the same argument
      # foundations/materials.html makes for the glass budget.
      #
      # The invariant is arithmetic, per axis: 2 x box <= file <= 3 x box. The
      # ceiling is the densest mainstream screen — past 3 x the bytes name
      # pixels no display can resolve; the floor is the other failure, a file
      # upscaled on the ordinary retina screen. The register is DERIVED from
      # the shipping stylesheets rather than listed, so it cannot be caught
      # short the way the breakpoint register was four times over.
      - name: Image scale
        if: '!cancelled()'
        run: python3 scripts/check-image-scale.py
