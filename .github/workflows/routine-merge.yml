name: Routine merge

# THE HOURLY ROUTINE CANNOT OPEN ITS OWN PULL REQUEST, so this opens it.
#
# The five landing-page routines merge their own work: their sessions hold a
# GitHub connector, so `gh` and the API are theirs to call. A routine created
# from inside a Claude Code session cannot inherit that connector — the create
# call says so in as many words — and its sessions come up with git and nothing
# else. Git is enough to push a branch and not enough to raise a PR, so a
# routine built that way would do the work, push it, and stop one step short of
# `main` every hour, unattended, with nobody looking.
#
# So the last step moves into the repository, where it needs no credential of
# anyone's: a push to `routine/system-pages-**` runs the same gate CI runs,
# opens the pull request from the branch's own commit message, and squash-merges
# it. What lands on `main` is what would have landed anyway; what changes is who
# holds the token.
#
# THE GATE IS RUN HERE AND NOT WAITED FOR, and that is a GitHub constraint
# rather than a shortcut. A pull request opened with GITHUB_TOKEN does not
# trigger other workflows, so design-system.yml's `pull_request` job will never
# run on a PR this file creates — waiting for it would wait forever. The forty
# checks are a few hundred milliseconds of stdlib python, so this job simply
# runs them itself, in one step, before it opens anything. `main` is still
# covered twice over: design-system.yml runs on every push to it.
#
# A FAILING GATE STILL OPENS THE PULL REQUEST. The work is worth looking at
# whether or not it can land, and a branch nobody can see is a run nobody can
# review. The job then fails, the PR stays open, and the routine's own next run
# reads it.
#
# SCOPED TO ONE PREFIX ON PURPOSE. `routine/**` would catch the five
# landing-page lanes, which raise and merge their own PRs — two agents opening
# a PR for one branch is a race with a duplicate PR at the end of it. This file
# owns exactly the branches of the routine that has no other way home.
#
# → .github/ROUTINES.md, "System design & pages"

on:
  push:
    branches: ['routine/system-pages-**']
  workflow_dispatch:

# Least privilege that can do the job: write the merge commit, write the PR.
permissions:
  contents: write
  pull-requests: write

# One at a time. Two runs merging into main at once is a rebase race, and the
# routine is hourly — there is never a reason for two.
concurrency:
  group: routine-merge
  cancel-in-progress: false

jobs:
  gate-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The same forty checks design-system.yml runs, in the same order, with
      # the same python. Every one must pass; the list is globbed rather than
      # enumerated so a check written by a later run is enforced by existing.
      - name: The design system's self-checks
        id: gate
        run: |
          fail=0
          for s in scripts/check-*.py; do
            echo "::group::$s"
            if python3 "$s"; then :; else fail=1; echo "::error::$s failed"; fi
            echo "::endgroup::"
          done
          exit $fail

      # --fill takes the title and body from the branch's own commit, which is
      # where the routine is told to write what it measured. One PR per branch:
      # a re-push after a fix reuses the open one rather than stacking.
      - name: Open the pull request
        if: always()
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          url=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            url=$(gh pr create --base main --head "$BRANCH" --fill)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Pull request: $url"

      # Only on a green gate. Squash, because the branch is one finding however
      # many commits it took; delete, because the routine names a new branch
      # every hour and the list is otherwise unreadable by tomorrow.
      - name: Merge it
        if: steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pr.outputs.url }}" --squash --delete-branch

      # --body-file and not a heredoc: inside a YAML block scalar every line
      # keeps its relative indentation, so a `<<'EOF'` terminator would arrive
      # indented, bash would not recognise it as the terminator, and the rest of
      # the step would be swallowed into the message.
      - name: Say why it did not merge
        if: steps.gate.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf 'A `scripts/check-*.py` failed on this branch, so it was not merged.\n\n'
            printf 'The failing check is named in the run log: %s\n\n' "$RUN_URL"
            printf 'Nothing here is weakened to get green — fix the change or withdraw it.\n\n'
            printf -- '---\n_Generated by [Claude Code](https://claude.ai/code)_\n'
          } > /tmp/why.md
          gh pr comment "${{ steps.pr.outputs.url }}" --body-file /tmp/why.md
