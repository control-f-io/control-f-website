name: Routine merge

# THE HOURLY ROUTINE CANNOT OPEN ITS OWN PULL REQUEST, so this opens it.
#
# The five landing-page routines merge their own work: their sessions hold a
# GitHub connector, so `gh` and the API are theirs to call. A routine created
# from inside a Claude Code session cannot inherit that connector — the create
# call says so in as many words — and its sessions come up with git and nothing
# else. Git is enough to push a branch and not enough to raise a PR, so a
# routine built that way would do the work, push it, and stop one step short of
# `main` every hour, unattended, with nobody looking.
#
# So the last step moves into the repository, where it needs no credential of
# anyone's: a push to `routine/system-pages-**` runs the same gate CI runs and
# squash-merges the branch into `main` with its own commit message. What lands
# on `main` is what would have landed anyway; what changes is who holds the
# token.
#
# THE GATE IS RUN HERE AND NOT WAITED FOR, and that is a GitHub constraint
# rather than a shortcut. A pull request opened with GITHUB_TOKEN does not
# trigger other workflows, so design-system.yml's `pull_request` job will never
# run on a PR this file creates — waiting for it would wait forever. The forty
# checks are a few hundred milliseconds of stdlib python, so this job simply
# runs them itself, in one step, before it opens anything. `main` is still
# covered twice over: design-system.yml runs on every push to it.
#
# THE PULL REQUEST IS ATTEMPTED AND NOT REQUIRED. It is worth having — a branch
# nobody can see is a run nobody can review — but this repository does not let a
# workflow open one ("GitHub Actions is not permitted to create or approve pull
# requests"), so the step below tries and carries on. The merge is git's either
# way, and it happens only after the gate; on a red gate nothing lands, the
# branch stays, and the reason goes into the job summary.
#
# SCOPED TO ONE PREFIX ON PURPOSE. `routine/**` would catch the five
# landing-page lanes, which raise and merge their own PRs — two agents opening
# a PR for one branch is a race with a duplicate PR at the end of it. This file
# owns exactly the branches of the routine that has no other way home.
#
# → .github/ROUTINES.md, "System design & pages"

on:
  push:
    branches: ['routine/system-pages-**']
  workflow_dispatch:
  # AND CALLABLE, because the one push this file cannot see is a workflow's own.
  #
  # The rule in the header — "a pull request opened with GITHUB_TOKEN does not
  # trigger other workflows" — is not about pull requests. It is about the
  # token, and it applies to a push just as squarely. The routine pushes with a
  # user credential, so its branches raise this workflow; news-sync.yml pushes
  # with `github.token`, so its branch sat on the remote with no run against it
  # and nobody watching. Measured: branch routine/system-pages-news-20260807-2155
  # pushed at 21:55, zero runs of this workflow for that ref, ninety-six files
  # of imported archive stranded until somebody opened the PR by hand.
  #
  # A caller therefore says which branch it means, instead of relying on an
  # event that will not arrive. Everything below reads that input when it is
  # given and the pushed ref when it is not, so the two entrances gate exactly
  # the same way.
  workflow_call:
    inputs:
      branch:
        description: The routine branch to gate and merge
        type: string
        required: true

# Least privilege that can do the job: write the merge commit, write the PR,
# and — once the merge is on main — start the deploy that a human merge would
# have started as a push event. This job pushes with GITHUB_TOKEN, which never
# raises a push event, so it dispatches the deploy by name; workflow_dispatch
# and repository_dispatch are the two event kinds the token is allowed to
# raise at all.
permissions:
  contents: write
  pull-requests: write
  actions: write

# One at a time. Two runs merging into main at once is a rebase race, and the
# routine is hourly — there is never a reason for two.
concurrency:
  group: routine-merge
  cancel-in-progress: false

jobs:
  gate-and-merge:
    runs-on: ubuntu-latest
    steps:
      # The branch, not the ref that started this. On a push they are the same
      # string; on a call the caller is sitting on main and the work is on the
      # branch it names, and a gate run against main would pass without ever
      # looking at what it is about to merge.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref_name }}

      # Everything design-system.yml runs, with the same python. Every one must
      # pass; the check list is globbed rather than enumerated so a check
      # written by a later run is enforced by existing.
      #
      # THE SIX BUILDS ARE PART OF THE GATE AND WERE NOT, WHICH COST A DEPLOY.
      # This step used to glob scripts/check-*.py and stop there, while the six
      # `--check` steps lived only in design-system.yml — a workflow that a
      # GITHUB_TOKEN push never starts. So a branch that changed German copy
      # without adding the pair to design-system/i18n/en.json passed this gate,
      # self-merged, and only then went red: on main, in design-system.yml, and
      # again in deploy.yml, which runs build-i18n.py in WRITE mode before it
      # uploads and exits 1 on the missing entry. The site stops deploying —
      # both editions, every page — until somebody repairs the catalogue by
      # hand. The gate is the only thing standing in front of an unattended
      # merge, so it has to assert what the deploy will assert.
      #
      # In build-all.sh's order, and after the checks so a broken drawing is
      # still reported when a catalogue entry is also missing.
      - name: The design system's self-checks
        id: gate
        run: |
          fail=0
          # THE BUILD FIRST, AND IT IS NOT OPTIONAL ANY MORE. The generated
          # website is not tracked as of 2026-08-17, so this checkout does not
          # have a single one of its 154 pages until this runs — and two checks
          # read pages (check-form-contract.py wants patterns/en/kontakt.html,
          # check-links.py resolves every href). It is also the gate on the
          # tracked half: build-and-verify.sh fails if building moved a tracked
          # file, which is how a German string without its English pair, an edit
          # inside a news:/jobs: fence, or a stale content ledger is refused
          # BEFORE the merge. It replaces the six `--check` steps this loop ran,
          # and asserts more than they could.
          echo "::group::scripts/build-and-verify.sh"
          if sh scripts/build-and-verify.sh; then :; else
            fail=1; echo "::error::the build moved a tracked file, or a builder failed"
          fi
          echo "::endgroup::"
          for s in scripts/check-*.py; do
            echo "::group::$s"
            if python3 "$s"; then :; else fail=1; echo "::error::$s failed"; fi
            echo "::endgroup::"
          done
          exit $fail

      # THE MERGE IS GIT'S, AND THE PULL REQUEST IS A NICETY ON TOP OF IT.
      #
      # `gh pr create` answered, on the run that imported the Stellen register:
      #
      #     GraphQL: GitHub Actions is not permitted to create or approve pull
      #     requests (createPullRequest)
      #
      # That is a repository setting — Settings → Actions → General → "Allow
      # GitHub Actions to create and approve pull requests" — and it is off
      # here, deliberately or by inheritance from the organisation. It exists to
      # stop a workflow opening a pull request and approving its own work, which
      # is a real hazard and not one worth arguing with.
      #
      # It says nothing about `contents: write`, which this job already has. So
      # the branch is merged with git, after the gate, and the pull request is
      # attempted and skipped if it is refused. Nothing about the gate changes:
      # every scripts/check-*.py runs against the branch BEFORE anything lands,
      # which was always where the gating happened — the file's own header says
      # the PR is opened because "the work is worth looking at", not because it
      # was ever what held the branch back.
      #
      # What is lost when the setting is off is the pull request as a record.
      # The commit message survives it: `git log` on main is this repository's
      # changelog and the message is written to be read as one.
      - name: Open the pull request, if this repository lets a workflow
        if: always()
        id: pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          url=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            if ! url=$(gh pr create --base main --head "$BRANCH" --fill 2>/tmp/pr.err); then
              echo "::notice::no pull request opened — $(head -1 /tmp/pr.err)"
              echo "Turn it on in Settings → Actions → General if you want one." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Pull request: $url"

      # Only on a green gate. Squashed, because the branch is one finding
      # however many commits it took, and the branch is deleted because the
      # routine names a new one every hour.
      #
      # THE RETRY IS NOT DEFENSIVE PROGRAMMING. main moves several times an hour
      # — five landing routines, the system-pages routine and this sync all
      # merge into it — so between the fetch and the push another run can land.
      # One re-fetch and one replay is enough for that; two failures in a row
      # mean something is genuinely in the way and the branch is left standing.
      - name: Merge it
        if: steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Named explicitly rather than assumed: the checkout above took the
          # branch as a detached ref, and `origin/<branch>` is only a local
          # remote-tracking name if the fetch happened to write one.
          git fetch origin "$BRANCH:refs/heads/cf-merge-source"
          subject=$(git log -1 --format=%B cf-merge-source)
          for attempt in 1 2; do
            git fetch origin main
            git checkout -B main origin/main
            git merge --squash cf-merge-source
            git commit -m "$subject" || { echo "nothing to merge"; exit 0; }
            if git push origin main; then
              git push origin --delete "$BRANCH"
              echo "merged $BRANCH into main"
              # THE MERGE JUST PUSHED WITH GITHUB_TOKEN, AND THE DEPLOY IS
              # TRIGGERED BY THE PUSH EVENT THAT TOKEN NEVER RAISES. A human
              # merge lands and Deploy to GitHub Pages starts on its own; this
              # one has to name the workflow — or main gains the content while
              # the site keeps serving the page before it, which is the same
              # hour of lag this whole file exists to cancel (see news-sync.yml's
              # "called and not left to the push event"). Dispatch is one of the
              # two event kinds the token is allowed to raise, deploy.yml's
              # concurrency group queues the run behind a busy deploy instead of
              # killing it, and a failed dispatch cannot un-merge what landed —
              # so it reports loudly and leaves the merge standing.
              #
              # BOTH DEPLOYS, because there are two and the same token blindness
              # applies to each. deploy-worker.yml listens for the push event as
              # well, so before this loop named it the Cloudflare copy sat at the
              # previous user-credential push after every merge that came through
              # here — measured on the three Notion syncs of 2026-08-13: stale
              # for 42 min, 2 h 38 min and 16 min, until an unrelated human merge
              # raised a push event and carried the content over by accident.
              # Pages is the serving origin today so the cost was invisible; the
              # day the DNS cutover makes the Worker the site, an hourly content
              # import that never reaches it is the whole pipeline silently
              # failing. It is gated on CLOUDFLARE_ENABLED inside its own file,
              # so dispatching it when Cloudflare is off costs one skipped run.
              for wf in "Deploy to GitHub Pages" "Deploy the Worker"; do
                if gh workflow run "$wf" --ref main 2>/tmp/deploy.err; then
                  echo "dispatched $wf — main is what will be served"
                else
                  echo "::error::main moved but $wf was not started — $(head -1 /tmp/deploy.err)"
                  echo "The merge succeeded; run \"$wf\" by hand." >> "$GITHUB_STEP_SUMMARY"
                fi
              done
              exit 0
            fi
            echo "main moved under this run; replaying (attempt $attempt)"
          done
          echo "::error::could not merge $BRANCH into main after two attempts — the branch is still there"
          exit 1

      # --body-file and not a heredoc: inside a YAML block scalar every line
      # keeps its relative indentation, so a `<<'EOF'` terminator would arrive
      # indented, bash would not recognise it as the terminator, and the rest of
      # the step would be swallowed into the message.
      #
      # And only when there IS a pull request to say it on. Without one the run
      # log is the record, so the same reason goes into the job summary, where
      # whoever opens the failed run reads it first.
      - name: Say why it did not merge
        if: steps.gate.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ steps.pr.outputs.url }}
        run: |
          {
            printf 'A `scripts/check-*.py` failed on this branch, so it was not merged.\n\n'
            printf 'The failing check is named in the run log: %s\n\n' "$RUN_URL"
            printf 'Nothing here is weakened to get green — fix the change or withdraw it.\n\n'
            printf -- '---\n_Generated by [Claude Code](https://claude.ai/code)_\n'
          } > /tmp/why.md
          cat /tmp/why.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body-file /tmp/why.md
          fi
