name: Content from Notion

# Notion writes the archive and the vacancy register; this brings them over.
#
# The admin's loop is one place: write the post in the news database or the
# opening in the Stellen database, set Status to "Veröffentlicht", and within
# the hour it is on the site. Nothing here is a second way to author — the two
# sync scripts only write content/, and the build lays out the pages from those
# files exactly as it does for anything written by hand. Two stores, two ways
# into each.
#
# THE ARCHIVE'S FILTER COMES OVER WITH IT. The `Themen` multi-select's options
# are the chips on news.html, and sync-news-notion.py writes them into
# content/themen.json — so a topic invented in Notion is a chip on the site
# without a code change. The one thing it cannot bring is the English name: a
# multi-select option has nowhere to keep one, so a new topic arrives with `en`
# empty, this run says so, and build-news.py stops the day a published post
# carries it. → design-system/README.md, "The topics"
#
# ONE WORKFLOW FOR BOTH, deliberately. Each sync could have its own file, and
# then two jobs would branch off main in the same minute, each rebuild
# everything, and the second pull request would need a rebase the moment the
# first merged. One run, one branch, one gate.
#
# IT PUSHES A BRANCH RATHER THAN COMMITTING TO main, and then CALLS the gate on
# it: .github/workflows/routine-merge.yml, the same one the hourly routine's
# branches go through. So a sync takes the same forty checks every other change
# does, arrives as a pull request whose body says what moved, and merges only if
# it is green. A workflow that pushed straight to main would be the one path
# into this repository with no gate on it, and it would be the path taken by an
# unattended job reading an external service.
#
# CALLED AND NOT LEFT TO THE PUSH EVENT, and this cost a run to learn. A push
# made with GITHUB_TOKEN does not trigger other workflows — the same rule
# routine-merge.yml states for pull requests, which is about the token and not
# about the event. This file used to push the branch and say the gate would pick
# it up; it did not. Branch routine/system-pages-news-20260807-2155 was pushed
# at 21:55 with the whole archive on it, zero runs started, and it stayed on the
# remote until a person opened the pull request. The branch is now handed over
# by name instead of by hope.
#
# NOTHING RUNS WITHOUT THE SECRETS. NOTION_TOKEN is an internal integration's
# token, added in Settings → Secrets and variables → Actions; NOTION_NEWS_DB and
# NOTION_JOBS_DB are the two database ids. Each store needs the token and its own
# id, and until a pair exists that store is skipped rather than failed on: an
# unconfigured integration is not a broken build.
#
# → design-system/README.md, "Add a news post" and "Advertise a position"

on:
  schedule:
    - cron: '25 * * * *'      # between the routines' :11 and :39, clear of both
  workflow_dispatch:
    inputs:
      force:
        description: 'Allow a sync that removes most of the archive or empties the register'
        type: boolean
        default: false

# contents to push the branch; pull-requests because the gate this calls opens
# and merges one, and a called workflow cannot hold a permission its caller
# does not.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.push.outputs.branch }}
    steps:
      - uses: actions/checkout@v4

      # Each store is configured on its own: the news database was connected
      # first and the Stellen database later, and a repository with one of the
      # two set up is a normal state rather than a broken one.
      - name: Is it configured?
        id: cfg
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_NEWS_DB: ${{ secrets.NOTION_NEWS_DB }}
          NOTION_JOBS_DB: ${{ secrets.NOTION_JOBS_DB }}
        run: |
          news=no; jobs=no
          if [ -n "$NOTION_TOKEN" ] && [ -n "$NOTION_NEWS_DB" ]; then news=yes; fi
          if [ -n "$NOTION_TOKEN" ] && [ -n "$NOTION_JOBS_DB" ]; then jobs=yes; fi
          if [ "$news" = no ] && [ "$jobs" = no ]; then
            echo "No NOTION_TOKEN with a database id — nothing to sync."
          fi
          echo "news=$news" >> "$GITHUB_OUTPUT"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "ready=$([ "$news" = yes ] || [ "$jobs" = yes ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      # The one package the sync has, for the one thing pip is needed for: a
      # picture that does not fit the plate is resized by fit_to_plate() as it
      # is imported, instead of failing the gate an hour later. Pinned to the
      # byte, and deliberately: the digest a fitted file is named by is the
      # digest of these exact bytes, so a Pillow upgrade that re-encoded
      # differently would rename every picture on the next run.
      - name: Install the picture fitter
        run: python3 -m pip install --quiet "Pillow==12.0.0"

      - name: Pull the archive from Notion
        if: steps.cfg.outputs.news == 'yes'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_NEWS_DB: ${{ secrets.NOTION_NEWS_DB }}
        run: |
          python3 scripts/sync-news-notion.py \
            ${{ inputs.force && '--force' || '' }}

      - name: Pull the vacancy register from Notion
        if: steps.cfg.outputs.jobs == 'yes'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_JOBS_DB: ${{ secrets.NOTION_JOBS_DB }}
        run: |
          python3 scripts/sync-jobs-notion.py \
            ${{ inputs.force && '--force' || '' }}

      # The two stores, the English edition, the pages per item and the shipping
      # pages, in the one order they work in. Committing a sync without them
      # would leave the store and the pages disagreeing, which the --check of
      # each builder then fails on — correctly, and after the fact.
      - name: Rebuild
        if: steps.cfg.outputs.ready == 'yes'
        run: sh scripts/build-all.sh

      - name: Push it, if anything moved
        if: steps.cfg.outputs.ready == 'yes'
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Notion has nothing this repository does not already have."
            exit 0
          fi
          BR="routine/system-pages-notion-$(date -u +%Y%m%d-%H%M)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add -A
          # The commit message is the pull request: routine-merge.yml opens it
          # with `gh pr create --fill`, so what moved has to be stated here.
          {
            printf 'The site follows Notion\n\n'
            printf 'Imported by scripts/sync-news-notion.py and scripts/sync-jobs-notion.py\n'
            printf 'from the news and Stellen databases, then laid out by build-news.py and\n'
            printf 'build-jobs.py and rebuilt into both editions.\n\n'
            printf 'Files changed in content/:\n\n'
            git diff --cached --name-status -- content | sed 's/^/    /'
            printf '\nCo-Authored-By: Claude Opus 5 <noreply@anthropic.com>\n'
          } > /tmp/msg
          git commit -F /tmp/msg
          git push -u origin "$BR"
          # The name is the handover. The next job gates this branch by reading
          # it, because the push above starts nothing on its own.
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          echo "pushed $BR — the gate job takes it from here"

  # The same gate the routine's own branches go through, called by name. It
  # runs every scripts/check-*.py against the branch, opens the pull request
  # from the commit message written above, and squash-merges it if the gate is
  # green. A red gate leaves the pull request open with the reason on it.
  gate:
    needs: sync
    if: needs.sync.outputs.branch != ''
    uses: ./.github/workflows/routine-merge.yml
    with:
      branch: ${{ needs.sync.outputs.branch }}
    # actions: write because the gate dispatches Deploy to GitHub Pages after
    # it merges — its merge push uses GITHUB_TOKEN, which never raises the push
    # event that deploy is triggered by — and a called workflow cannot hold a
    # permission its caller does not.
    permissions:
      contents: write
      pull-requests: write
      actions: write
