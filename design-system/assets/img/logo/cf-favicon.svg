<!-- Control-F Favicon. The nav lockup's own two marks on the nav lockup's own
     black plate, squared for a tab strip.

     THE PLATE IS NOT DECORATION. A tab strip is light in one browser theme and
     dark in the other, and the bare symbol ships in exactly two colours — white
     (invisible on the light strip) and black (invisible on the dark one). The
     plate is what the horizontal logo already puts behind the mark everywhere
     it appears on these pages, so carrying it here costs nothing and makes the
     icon legible on either strip without a second file or a media query.

     The art is cf-symbol-white.svg unchanged, 600 x 480 in its own units,
     centred on a 640 square: x + 20, y + 80. -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none">
  <rect width="640" height="640" rx="96" fill="#101010"/>
  <g transform="translate(20,80)">
    <path d="M425.367 332.683C423.155 331.578 423.155 328.422 425.367 327.317L594.633 242.683C596.845 241.578 596.845 238.422 594.633 237.317L483.578 181.789C481.325 180.663 478.675 180.663 476.422 181.789L185.367 327.317C183.155 328.422 183.155 331.578 185.367 332.683L476.422 478.211C478.675 479.337 481.325 479.337 483.578 478.211L594.633 422.683C596.845 421.578 596.845 418.422 594.633 417.317L425.367 332.683Z" fill="#FFFFFF"/>
    <path d="M116.422 298.211C118.675 299.337 121.325 299.337 123.578 298.211L594.633 62.6833C596.845 61.5777 596.845 58.4223 594.633 57.3167L483.578 1.78885C481.325 0.662745 478.675 0.662745 476.422 1.78885L5.36656 237.317C3.15542 238.422 3.15542 241.578 5.36656 242.683L116.422 298.211Z" fill="#FFFFFF"/>
