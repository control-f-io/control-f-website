<!-- Control-F Favicon. The signet alone, on nothing.

     THE PLATE IS GONE, and it was deliberate before it was wrong. A tab strip
     is light in one browser theme and dark in the other, the bare symbol ships
     in exactly two colours, and a black plate under a white mark is legible on
     both strips without a media query. It is also the loudest thing in a row of
     tabs: a filled near-black square with a rounded corner reads as an app icon
     rather than as this company's mark, and at 16 px the plate is most of what
     anybody sees. The brand manual's frame chapter defines five frames and the
     first of them is transparent — this is that one.

     THE MEDIA QUERY IS WHAT THE PLATE USED TO DO. The mark is CF-Schwarz on a
     light strip and CF-Weiss on a dark one, switched by prefers-color-scheme
     inside the file. One asset, both strips, no second file: an SVG icon is a
     document and carries its own stylesheet. A browser that ignores the query
     paints the black, which is the state a light strip wants and the one every
     browser's default theme ships.

     The two fills are the palette's own: #000000 is CF-Schwarz and #FFFFFF is
     CF-Weiss (design-system/assets/css/tokens.css). The plate painted #101010,
     a near-black in no token, and the palette chapter names a second dark that
     differs from black by 1.2:1 as exactly the drift it removed.

     Nothing in this comment may contain a double hyphen. XML forbids one inside
     a comment, and an SVG that does not parse does not load at all: as an icon
     it is a blank tab, as an img a broken image, and in neither case an error
     anybody sees. Writing the token names with their leading dashes is what
     cost this file a render.

     The art is cf-symbol-white.svg's two paths unchanged, 600 x 480 in their
     own units, centred on the same 640 square as before: x + 20, y + 80.
     scripts/check-favicon-frame.py holds all of it — the paths against the
     symbol they are cut from, the two fills, the query, and the absence of a
     background. -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none">
  <style>
    .cf-favicon-mark { fill: #000000; }
    @media (prefers-color-scheme: dark) {
      .cf-favicon-mark { fill: #FFFFFF; }
    }
  </style>
  <g class="cf-favicon-mark" transform="translate(20,80)">
    <path d="M425.367 332.683C423.155 331.578 423.155 328.422 425.367 327.317L594.633 242.683C596.845 241.578 596.845 238.422 594.633 237.317L483.578 181.789C481.325 180.663 478.675 180.663 476.422 181.789L185.367 327.317C183.155 328.422 183.155 331.578 185.367 332.683L476.422 478.211C478.675 479.337 481.325 479.337 483.578 478.211L594.633 422.683C596.845 421.578 596.845 418.422 594.633 417.317L425.367 332.683Z"/>
    <path d="M116.422 298.211C118.675 299.337 121.325 299.337 123.578 298.211L594.633 62.6833C596.845 61.5777 596.845 58.4223 594.633 57.3167L483.578 1.78885C481.325 0.662745 478.675 0.662745 476.422 1.78885L5.36656 237.317C3.15542 238.422 3.15542 241.578 5.36656 242.683L116.422 298.211Z"/>
  </g>
</svg>
