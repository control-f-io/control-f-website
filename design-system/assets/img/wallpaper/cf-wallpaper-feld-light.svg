<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2340" width="1080" height="2340" role="img" aria-label="Control-F wallpaper for phones: the isometric lattice on the page wash, with the mark in the shadow half of the foil">
<title>Control-F — Feld, light</title>
<!--
  9:19.5, the tall phone frame. The light counterpart of
  cf-wallpaper-feld-dark.svg and the same construction throughout: the page
  wash instead of a black ground, ink instead of light in the lattice, and
  the shadow half of the foil in the mark because a lit foil on CF-Grau
  measures between 1.1:1 and 1.5:1 and would not be there.

  The wash is the page's own wash-stops, to the digit: the iridescent
  CF-Grau-to-white ramp the whole site stands on, with its three chromatic
  stops at the positions tokens.css derives for them. The grain tile is the
  system's own grain, unchanged, and it is not decoration — a 2340 px ramp
  between two colours this close bands in 8-bit sRGB without it.
-->
<defs>
  <linearGradient id="wash" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="2340">
    <stop offset="0" stop-color="#CFCFD2"/>
    <stop offset=".439" stop-color="#E1E4E7"/>
    <stop offset=".8293" stop-color="#F3F8F7"/>
    <stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>

  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>

  <!-- The pool, centred on the mark rather than on the frame: the light in
       this picture has a source, and the source is the object standing on
       the floor. 2:1, as everywhere. -->
  <radialGradient id="pool" gradientUnits="userSpaceOnUse"
                  cx="540" cy="1250" r="920" gradientTransform="matrix(1 0 0 .5 0 625)">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset=".46" stop-color="#FFFFFF" stop-opacity=".45"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <mask id="lit"><rect width="1080" height="2340" fill="url(#pool)"/></mask>

  <!-- 0.14, not the CSS field's 0.10. Nothing is read over a wallpaper, so
       the text-contrast ceiling that sets the CSS value does not apply here
       and the number that does is the one where the floor is legible on a
       phone in daylight. -->
  <pattern id="lattice" width="120" height="60" patternUnits="userSpaceOnUse">
    <path d="M0 0 L120 60 M0 60 L120 0" fill="none"
          stroke="#000000" stroke-opacity=".14" stroke-width="1"/>
  </pattern>

  <!-- The shadow half of the foil: foil-ink-stops, at the same shallow rake.

       COORDINATES ARE THE MARK'S OWN, not the canvas's, and that is the trap
       the README calls out under "three things that vanish quietly": a
       userSpaceOnUse paint server is resolved in the user space where it is
       REFERENCED, so the group's own transform moves the gradient with it.
       Written in canvas coordinates this ramp landed entirely off the mark
       and every glyph clamped to the first stop. 0,0 to 600,300 is dx 2 /
       dy 1 in the mark's 600 x 480 space, and the group's scale is uniform,
       so it is still 26.57 deg on screen.

       THE RAMP SPANS THE GLYPH, NOT ITS BOX. Projected on the 2:1 axis the
       drawn mark runs from t 0.165 at the upper chevron's left tip to t
       1.073 at the lower one's far corner; a ramp laid across 0 to 1 spends
       its first sixth and its last twelfth on empty space, which on this
       ramp means the lime end never lands on the mark at all. 100,50 to
       644,322 is those two projections, and dx 544 / dy 272 is still 2:1. -->
  <linearGradient id="foilInk" gradientUnits="userSpaceOnUse"
                  x1="100" y1="50" x2="644" y2="322">
    <stop offset="0" stop-color="#45524F"/>
    <stop offset=".47" stop-color="#283E4F"/>
    <stop offset="1" stop-color="#2C2C4F"/>
  </linearGradient>

  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
</defs>

<rect width="1080" height="2340" fill="url(#wash)"/>
<rect width="1080" height="2340" fill="url(#lattice)" mask="url(#lit)"/>
<rect width="1080" height="2340" filter="url(#grain)" opacity=".08"/>

<g transform="translate(300 1000) scale(0.8)">
  <path fill="url(#foilInk)" d="M425.367 332.683C423.155 331.578 423.155 328.422 425.367 327.317L594.633 242.683C596.845 241.578 596.845 238.422 594.633 237.317L483.578 181.789C481.325 180.663 478.675 180.663 476.422 181.789L185.367 327.317C183.155 328.422 183.155 331.578 185.367 332.683L476.422 478.211C478.675 479.337 481.325 479.337 483.578 478.211L594.633 422.683C596.845 421.578 596.845 418.422 594.633 417.317L425.367 332.683Z"/>
  <path fill="url(#foilInk)" d="M116.422 298.211C118.675 299.337 121.325 299.337 123.578 298.211L594.633 62.6833C596.845 61.5777 596.845 58.4223 594.633 57.3167L483.578 1.78885C481.325 0.662745 478.675 0.662745 476.422 1.78885L5.36656 237.317C3.15542 238.422 3.15542 241.578 5.36656 242.683L116.422 298.211Z"/>
</g>

<!-- THE ONE LIME MOMENT, and it is the mark's own footprint: a single cell
     of the floor directly under the object, lit. The precedent is the
     manual's Isometrie-Raster plate, which fills the top face of its cube
     lime and nothing else on the page. The cell is a real face of the
     lattice, not a rhombus placed near it: face centres sit at
     (60 + 120i, 60j) and (120i, 30 + 60j), and (540, 1500) is the first
     form at i = 4, j = 25. Put it anywhere else and it floats. -->
<g mask="url(#lit)">
  <path d="M480 1500 L540 1470 L600 1500 L540 1530 Z" fill="#E1FF00" fill-opacity=".45" filter="url(#glow)"/>
</g>
<path d="M480 1500 L540 1470 L600 1500 L540 1530 Z" fill="#E1FF00"/>
</svg>
