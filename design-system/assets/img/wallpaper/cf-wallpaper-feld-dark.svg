<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Control-F wallpaper: the isometric lattice lit from the left, with the mark cropped by the right edge and filled with the light ramp">
<title>Control-F — Feld, dark</title>
<!--
  16:9. Resolution-independent: the file is authored at 1920 x 1080 and
  renders at any size, so one file covers 1080p through 5K.

  Built from nothing but the system's own parts, in the order the six
  material layers stack: opaque ground, contour (the lattice), light (the
  ramp in the mark). There is no photograph in it and no shape that is not
  on the lattice.

  Unlike the CSS field, the contour here SCALES with the picture. A
  wallpaper is an image, not a UI surface, so a hairline pinned to one
  device pixel would vanish on a 5K screen instead of holding its weight.
-->
<defs>
  <!-- The ground. Light arriving from the left at the height of the
       horizon, exactly as the manual's Farben > Anwendung plate lights its
       wallpaper panel. Schwarz to grey-800 and back; no hue, because the
       hue in this picture is all in the mark. -->
  <radialGradient id="ground" gradientUnits="userSpaceOnUse"
                  cx="420" cy="560" r="1560" gradientTransform="matrix(1 0 0 .5 0 280)">
    <stop offset="0" stop-color="#1F1F1F"/>
    <stop offset=".55" stop-color="#0B0B0B"/>
    <stop offset="1" stop-color="#000000"/>
  </radialGradient>

  <!-- Dither. 31 levels of grey over a 1560-unit radius is below what 8-bit
       sRGB can resolve, which is the page wash's problem one surface out and
       worse: measured on the rendered frame before this filter existed,
       42.9 % of the picture sat in a flat plateau of eight pixels or more.
       The system's own grain, primitive for primitive — the grain tile in
       tokens.css, and cf-wallpaper-feld-light.svg, which has carried it from
       the start while both dark files went without. (No double hyphen may
       appear in an XML comment, which is why no token in any of these files
       is written with its leading dashes.) -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>

  <!-- The pool of light. A 2:1 ellipse, the isometric circle, centred on
       the same source as the ground, so the floor is drawn only where it is
       lit and dissolves into the black everywhere else. Same shape and same
       0.45-at-46% plateau as field-bloom in tokens.css.

       White stops with stop-opacity rather than greys: a mask's value is
       luminance times alpha, and the luminance of white is 1, so the alpha
       IS the mask. Grey stops would have to be linearised first. -->
  <radialGradient id="pool" gradientUnits="userSpaceOnUse"
                  cx="420" cy="560" r="1180" gradientTransform="matrix(1 0 0 .5 0 280)">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset=".46" stop-color="#FFFFFF" stop-opacity=".45"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <mask id="lit"><rect width="1920" height="1080" fill="url(#pool)"/></mask>

  <!-- One rhombus, 120 x 60, tiled. The X in the cell is the whole lattice:
       both diagonals run on unbroken across the tile seams, which is what
       makes this two families of 26.57 deg lines rather than a row of
       crosses.

       0.16 AND NOT THE CSS FIELD'S 0.10. That ceiling is set by the worst
       text that has to stay readable across a lattice line. Nothing is read
       over a wallpaper, so the ceiling does not apply, and the number that
       does is the one where the floor is legible on a screen at arm's
       length. The video-call file keeps 0.10, because something IS in front
       of that one. -->
  <pattern id="lattice" width="120" height="60" patternUnits="userSpaceOnUse">
    <path d="M0 0 L120 60 M0 60 L120 0" fill="none"
          stroke="#FFFFFF" stroke-opacity=".16" stroke-width="1"/>
  </pattern>

  <!-- The light ramp, at the shallow rake, so it crosses the mark along the
       same axis foil-rake gives it in CSS. Stops and positions are the
       spectrum's own.

       THE SPECTRUM AND NOT THE FOIL, and that is where this file spends its
       one lime moment. The precedent is the manual's app icon on the Farben
       > Anwendung plate: a black plate whose MARK is filled with the light
       ramp while the plate stays black. A wallpaper is that object at the
       size of a screen, and the system already reads the plate that way for
       the solid button, whose label is filled rather than coloured.

       Because the lime is in the mark, there is no lit cell on the floor of
       this one. One light moment per screen, and a wallpaper is a screen.

       THE OKLAB WAYPOINT, WHICH THIS FILE SPENT A WHILE CLAIMING IT DID NOT
       NEED. The claim was that this ramp has no lime-to-Glas leg — true — and
       that lime-to-Weiss is therefore "the leg the system already leaves in
       sRGB on purpose". That is a different leg. The exemption tokens.css
       grants is for WEISS-TO-GLAS, at dE 0.00045; lime-to-Weiss was never
       measured, and it is the worst leg in the family:

         lime -> Weiss    0.04651   drawn #EFFF7A, oklab path #EEFFA7
         lime -> Glas     0.04512   the leg the process cards correct
         Weiss -> Glas    0.00045   the leg that is genuinely exempt

       So the ramp ran through the muddy yellow-green dip on the one leg that
       dips hardest, on a mark whose whole job is to catch light — while
       the spectrum token, the same five stops in CSS, took the oklab path.
       (An XML comment cannot contain a double hyphen, which is why no custom
       property is ever named in full inside one of these files.)
       Two statements of one ramp, disagreeing.

       The fix is the process cards' own: one stop carrying the oklab path by
       hand, at 19 % of the lime leg measured from lime, because SVG cannot
       interpolate in oklab. 19 % of this leg is offset .0342, and the colour
       there is #E6FF66. It takes the leg from dE 0.0465 to 0.0125. A second
       waypoint would reach 0.0092 and is not worth a stop.

       COORDINATES ARE THE MARK'S OWN, not the canvas's, and that is the trap
       the README calls out under "three things that vanish quietly": a
       userSpaceOnUse paint server is resolved in the user space where it is
       REFERENCED, so the group's own transform moves the gradient with it.
       Written in canvas coordinates this ramp landed entirely off the mark
       and every glyph clamped to the first stop. 0,0 to 600,300 is dx 2 /
       dy 1 in the mark's 600 x 480 space, and the group's scale is uniform,
       so it is still 26.57 deg on screen.

       THE RAMP SPANS THE GLYPH, NOT ITS BOX. Projected on the 2:1 axis the
       drawn mark runs from t 0.165 at the upper chevron's left tip to t
       1.073 at the lower one's far corner; a ramp laid across 0 to 1 spends
       its first sixth and its last twelfth on empty space, which on this
       ramp means the lime end never lands on the mark at all. 100,50 to
       644,322 is those two projections, and dx 544 / dy 272 is still 2:1. -->
  <linearGradient id="light" gradientUnits="userSpaceOnUse"
                  x1="100" y1="50" x2="644" y2="322">
    <!-- --spectrum-stops, to the digit, and the two kinds of waypoint in it
         answer two different questions. #E6FF66 at 19 % of the lime leg puts
         the sRGB path back on the oklab one, which is what an SVG cannot ask
         for. #B9E3EB and #B8CCF3 at the midpoints of the two legs that TURN
         put the straight line back on the polar arc, which no interpolation
         space gives either — the CSS ramp carries them and this drawing did
         not. → tokens.css, THE ARC -->
    <stop offset="0" stop-color="#E1FF00"/>
    <stop offset=".0342" stop-color="#E6FF66"/>
    <stop offset=".18" stop-color="#FFFFFF"/>
    <stop offset=".32" stop-color="#C5EBE2"/>
    <stop offset=".48" stop-color="#B9E3EB"/>
    <stop offset=".64" stop-color="#B8D7F1"/>
    <stop offset=".82" stop-color="#B8CCF3"/>
    <stop offset="1" stop-color="#BEBFF0"/>
  </linearGradient>
</defs>

<rect width="1920" height="1080" fill="url(#ground)"/>
<rect width="1920" height="1080" fill="url(#lattice)" mask="url(#lit)"/>
<!-- FOUR PER CENT AND NOT THE WASH'S EIGHT. The grain's own mean is a floor
     lift wherever it lands: on a wash that ends at white it costs nothing,
     on a near-black ground it is the one thing this file has to spend
     carefully. So the strength is the least that clears the banding, and the
     two are measured over the whole frame:

                    banded area   mean luminance
       no grain        42.9 %         53.14
       .04              9.5 %         55.79
       .08              9.4 %         58.54

     WHAT THE RESIDUAL 9.5 % IS, because it does not move at any strength:
     it is inside the MARK, not on the ground. Broken down by value it is
     255, 221, 220, 219, 218, 216 — the white-to-Glas end of the spectrum
     ramp filling the mark, which is a large enough object for its own legs
     to band. The mark is drawn ABOVE this layer, here and in the light file,
     because grain is a property of the base wash and not of anything
     standing on it. Dithering it too is a separate call and a designer's:
     the mark is also this file's one light moment, and grain over lime dulls
     the one thing the picture is for. Flagged on foundations/field.html. -->
<rect width="1920" height="1080" filter="url(#grain)" opacity=".04"/>

<!-- The mark, 1.9x its native 600 x 480, running off the right edge. The
     manual's own wallpaper panel crops the mark rather than centring it,
     and cropping is what tells you the object is larger than the frame
     instead of merely large inside it. -->
<g transform="translate(900 120) scale(1.9)">
  <path fill="url(#light)" d="M425.367 332.683C423.155 331.578 423.155 328.422 425.367 327.317L594.633 242.683C596.845 241.578 596.845 238.422 594.633 237.317L483.578 181.789C481.325 180.663 478.675 180.663 476.422 181.789L185.367 327.317C183.155 328.422 183.155 331.578 185.367 332.683L476.422 478.211C478.675 479.337 481.325 479.337 483.578 478.211L594.633 422.683C596.845 421.578 596.845 418.422 594.633 417.317L425.367 332.683Z"/>
  <path fill="url(#light)" d="M116.422 298.211C118.675 299.337 121.325 299.337 123.578 298.211L594.633 62.6833C596.845 61.5777 596.845 58.4223 594.633 57.3167L483.578 1.78885C481.325 0.662745 478.675 0.662745 476.422 1.78885L5.36656 237.317C3.15542 238.422 3.15542 241.578 5.36656 242.683L116.422 298.211Z"/>
</g>
</svg>
