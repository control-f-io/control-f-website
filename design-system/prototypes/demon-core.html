<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demon Core — Über uns easter egg</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<style>
  /* ============================================================
     DEMON CORE — the Über-uns header object, made live.

     The static version of this drawing is the page header on
     patterns/ueber-uns.html: a core inside an open shell, a reflector
     dome parked at the far end of the axis, and the gap between them
     that the whole composition is really about. Here the gap closes.
     Click the core: the reflector travels down the axis, hesitates,
     then snaps shut, and the assembly goes prompt critical in the
     brand palette.

     WHAT THIS IS NOT: the designer's file staged the accident with a
     screwdriver — the tool wedged in the gap, wiggling, slipping, and
     falling out of frame. It is removed here, and the sequence is
     retimed around its absence: the beat the wiggle used to fill is
     now a held pause with the reflector stopped one step short. The
     object does the whole thing itself, which is also the only version
     that survives being 585 px wide in a page header.

     Every path is verbatim from that source file, in its coordinate
     system, so nothing here has been retyped or re-approximated. One
     colour is corrected: the nucleus was #E0FF02, one digit off the
     palette's lime. Everything the STYLESHEET paints reads from
     tokens.css; the hexes still in the markup are presentation
     attributes, which cannot resolve a custom property, and they are the
     token values written out.

     NOT PART OF THE SYSTEM. Like the other two prototypes this carries
     its own styling and its own engine; only tokens.css is shared.
     ============================================================ */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Both boxes, and it takes both. <body>'s crop alone leaves the root still
     reporting the overflow, and the root's alone leaves body leaking into it;
     measured, only the pair brings scrollWidth back to clientWidth. */
  html {
    overflow-x: hidden;
    overflow-x: clip;
  }

  body {
    background: var(--cf-weiss);
    font-family: var(--font-mono);
    /* The ambient wash is inset -10 %, so it bleeds a tenth of the stage past
       each edge on purpose, and this line is what crops the bleed. It has to
       be `clip`: `overflow-x: hidden` on <body> PROPAGATES to the viewport
       and leaves body itself computing to `visible`, so the wash sailed
       straight past it and the document sat 128 px scrollable sideways at
       1280 — 77 at 768, 38 at 375 — with nothing out there to look at.
       `clip` is excluded from that propagation, so it stays on the box that
       declared it and crops what that box contains. It is also the form this
       system uses everywhere it crops, for the neighbouring reason: `hidden`
       makes a scrollport, and a stray scrollport is exactly this bug. The
       `hidden` line is kept under it for browsers without `clip`, which land
       on the behaviour this page already had. */
    overflow-x: hidden;
    overflow-x: clip;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    position: relative;
    width: min(1440px, 100vw);
    aspect-ratio: 1440 / 478;
    /* The burst radiates well past the composition's bounding box, and
       the ambient wash below is inset -10 %. Both are clipped to
       nothing without this. */
    overflow: visible;
  }

  .stage svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  /* ---------- the trigger ----------
     A real button rather than a hotspot drawn into the SVG, so the
     easter egg is reachable from the keyboard and announces itself.
     Its box is the source file's hotspot circle — cx 755.3, cy 214.6,
     r 70 — expressed against the 1440 × 478 stage, which holds at every
     width because the stage carries that aspect ratio. */
  .trigger {
    position: absolute;
    left: 47.59%;
    top: 30.25%;
    width: 9.72%;
    height: 29.29%;
    border: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    /* The button is over the drawing, not next to it — a focus ring is the
       only thing that may draw on top of the core, so it is the system's
       ring rather than the UA's orange. base.css is not loaded here, which
       is where that rule normally lives. */
    outline: none;
  }
  .trigger:focus-visible {
    outline: var(--stroke-2) solid var(--focus-ring);
    outline-offset: 4px;
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    margin: -1px; padding: 0; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }

  .hint {
    position: absolute;
    left: 52.4%;
    top: 72%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    /* --grey-400 is the token the mono meta line already uses, and it is
       the exact grey the source file hard-coded here. */
    color: var(--grey-400);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .stage:has(.trigger:hover):not(.running) .hint,
  .stage:has(.trigger:focus-visible):not(.running) .hint { opacity: 1; }

  /* ---------- the reflector travels ----------
     Two stops, not one. `arming` moves it 100 px down the axis and
     7.44 px onto it — the source drew the dome that far above the core's
     equator, and closing the gap is also closing that offset. Then it
     holds. `critical` covers the remaining 145 px in 0.16 s, which is
     the whole point: the first move is deliberate, the second is not. */
  #hemi {
    transition: transform 1.2s cubic-bezier(0.6, 0, 0.3, 1);
  }
  .stage.arming #hemi {
    transform: translate(-100px, 7.44px);
  }
  /* The travelling shell hands over to the closed sphere the instant it
     arrives, so the two never overlap as separate contours. */
  .stage.critical #hemi {
    transform: translate(-244.91px, 7.44px);
    opacity: 0;
    transition: transform 0.16s cubic-bezier(0.8, 0, 1, 1), opacity 0.1s ease;
  }

  #axis {
    transition: opacity 0.6s ease;
  }
  .stage.arming #axis,
  .stage.critical #axis {
    opacity: 0;
  }

  /* ---------- criticality: the flash ---------- */
  .flash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle at 52.5% 45%,
      var(--cf-weiss) 0%,
      var(--cf-lime) 18%,
      rgba(225, 255, 0, 0) 55%);
  }
  .stage.critical .flash {
    animation: flash 0.5s ease-out;
  }
  @keyframes flash {
    0%   { opacity: 0; }
    12%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---------- criticality: radiating discs and rings ----------
     Four gradient discs and six rings, staggered, in the order the
     palette is written: lime, glas, sky, violett, grau, schwarz. The
     blue flash is the one moment the whole palette is allowed at once. */
  #burst circle { opacity: 0; }

  .stage.critical .disc {
    animation: disc 2s cubic-bezier(0.2, 0.6, 0.3, 1) forwards;
  }
  .stage.critical .ring {
    animation: ring 1.9s cubic-bezier(0.2, 0.6, 0.3, 1) forwards;
  }
  @keyframes disc {
    0%   { transform: scale(0.05); opacity: 0.95; }
    100% { transform: scale(14);   opacity: 0; }
  }
  @keyframes ring {
    0%   { transform: scale(0.05); opacity: 1; }
    100% { transform: scale(26);   opacity: 0; }
  }

  .stage.critical .d1 { animation-delay: 0s; }
  .stage.critical .d2 { animation-delay: 0.12s; }
  .stage.critical .d3 { animation-delay: 0.26s; }
  .stage.critical .d4 { animation-delay: 0.42s; }
  .stage.critical .r1 { animation-delay: 0.05s; }
  .stage.critical .r2 { animation-delay: 0.2s; }
  .stage.critical .r3 { animation-delay: 0.38s; }
  .stage.critical .r4 { animation-delay: 0.58s; }
  .stage.critical .r5 { animation-delay: 0.8s; }
  .stage.critical .r6 { animation-delay: 1.05s; }

  /* the closed sphere, and the glow that says what it now contains */
  #closedShell {
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  .stage.critical #closedShell {
    opacity: 1;
    transition: opacity 0.1s ease;
    animation: glow 1.6s ease-out;
  }
  @keyframes glow {
    0%   { filter: drop-shadow(0 0 0px var(--cf-lime)); }
    15%  { filter: drop-shadow(0 0 40px var(--cf-lime)) drop-shadow(0 0 90px var(--cf-lime)); }
    100% { filter: drop-shadow(0 0 0px var(--cf-lime)); }
  }

  /* On reset the travelling shell reappears at home. Fading it back in
     is what keeps it from visibly driving backwards up the axis. */
  .stage.resetting #hemi {
    transition: opacity 0.5s ease 0.15s;
  }

  /* ambient brand wash behind everything while critical */
  .stage::before {
    content: "";
    position: absolute;
    inset: -10%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
    background:
      radial-gradient(circle at 52.5% 45%,
        rgba(225, 255, 0, 0.35) 0%,
        rgba(197, 235, 226, 0.28) 22%,
        rgba(114, 176, 226, 0.22) 42%,
        rgba(126, 127, 225, 0.18) 60%,
        rgba(255, 255, 255, 0) 78%);
  }
  .stage.critical::before { opacity: 1; }

  /* ---------- reduced motion ----------
     Nothing travels and nothing pulses; the reader gets the end state —
     shell closed, palette lit — and then it goes away again. */
  @media (prefers-reduced-motion: reduce) {
    #hemi, .flash, .disc, .ring, #closedShell {
      animation: none !important;
      transition: none !important;
    }
    .stage.critical::before { opacity: 1; }
    .stage.critical #closedShell { opacity: 1; }
  }
</style>

<script>
  var stage   = document.getElementById('stage');
  var trigger = document.getElementById('trigger');
  var running = false;

  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function setState() {
    stage.classList.remove('arming', 'critical');
    for (var i = 0; i < arguments.length; i++) stage.classList.add(arguments[i]);
  }

  trigger.addEventListener('click', function () {
    if (running) return;
    running = true;
    stage.classList.add('running');

    if (reducedMotion) {
      setState('critical');
      setTimeout(reset, 3000);
      return;
    }

    /* 1. the reflector starts down the axis (1.2 s) */
    setState('arming');

    /* 2. it arrives at 1200 and holds — the pause is the tell. Then the
          last 145 px happen in 0.16 s and the shell is shut. */
    setTimeout(function () { setState('critical'); }, 1900);

    /* 3. the burst runs ~2 s from there; cool down and reopen */
    setTimeout(reset, 5250);
  });

  function reset() {
    stage.classList.add('resetting');
    setState();
    stage.classList.remove('running');
    setTimeout(function () {
      stage.classList.remove('resetting');
      running = false;
    }, 900);
  }
</script>
