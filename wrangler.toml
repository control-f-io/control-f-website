# The website as a Worker with static assets.
#
# WHY A WORKER AND NOT ONLY STATIC FILES. Every page here is a static file and
# is served as one. The exception is the contact form: design-system/components/
# forms.html says of the error summary "It is rendered by the server, not by a
# script", and patterns/kontakt.html posts to its own URL so that a failed
# submit lands on that summary without anything running. That needs a server.
# This is the smallest one that does the job — one route, one method.
#
# WHY NOT CLOUDFLARE PAGES. Pages Functions still work, but Cloudflare's own
# guidance for a project starting today is Workers with static assets, and this
# is a project starting today. Static asset requests are free either way.
#
# THE OTHER DEPLOY STAYS. .github/workflows/deploy.yml keeps publishing the
# repo root to GitHub Pages. Nothing here replaces it; the cutover is a DNS
# decision, not a merge. See .github/workflows/deploy-worker.yml.

name = "control-f-website"
main = "worker/index.js"
compatibility_date = "2026-08-04"

# THE ALTERNATIVE CUTOVER: the website served from this Worker.
#
# NOT THE PLAN, as of 2026-09-02. The site stays on GitHub Pages and takes
# control-f.io there — README.md, "Domain cutover" — this Worker keeps answering
# the forms from workers.dev, DNS stays at iwantmyname and no zone moves. That
# path costs two things this one would buy: a validation error still lands the
# reader on the workers.dev address, and the old Wix URLs are answered by
# meta-refresh stubs rather than 301s (content/redirects.txt becomes
# _redirects on this surface, so the 301s are ready if this path is taken).
# Kept because it is four lines away and the procedure below is the hard part.
#
# Uncommenting this is what moves the website onto this Worker. It cannot be
# done from the repository alone, and it cannot be done first: a custom_domain
# route requires the zone to be IN this Cloudflare account, and as of
# 2026-08-07 the account holds exactly one zone, uipilot.ai. control-f.io is
# delegated to iwantmyname (dns1–3.iwantmyname.com) and www.control-f.io
# currently serves the old Wix site. Deploying the route before the zone exists
# fails, and because deploy-worker.yml runs on every merge, it would fail on
# every merge.
#
# The order that works:
#
#   1. Add control-f.io as a zone in this Cloudflare account and let the scan
#      import the existing records. CHECK MX AND THE RESEND DKIM/SPF RECORDS
#      BY HAND before going further — info@control-f.io is a live mailbox and
#      the contact form's own sending domain is verified against those records.
#      An incomplete import breaks company email the moment step 2 lands.
#   2. Change the nameservers at iwantmyname to the two Cloudflare gives you.
#      Nothing about the website changes yet; the imported records still point
#      at Wix.
#   3. Uncomment the block below and deploy. THIS is the moment the redesign
#      replaces the Wix site at that address — the DNS record is written by
#      wrangler, so there is no separate DNS step and no going back through
#      one either.
#
# Until step 3 the Worker answers on its workers.dev address only, GitHub Pages
# keeps serving control-f-io.github.io/control-f-website/, and the two deploys
# stay in step because both run on every merge.
#
# datenschutz.html already names Cloudflare and GitHub as the two processors
# that deliver this site, so the cutover does not need a second edit there.
#
# [[routes]]
# pattern = "control-f.io"
# custom_domain = true
#
# [[routes]]
# pattern = "www.control-f.io"
# custom_domain = true

[assets]
# dist/, written by scripts/stage-site.py: the sixteen generated pages and
# design-system/, and nothing else in the repository.
#
# NOT the repo root, although that is what GitHub Pages uploads. Wrangler
# writes its state into .wrangler/ inside the assets directory, so a root
# assets directory makes it watch what it is writing — `wrangler dev` then
# reloads without stopping (387 times in two minutes, measured). .assetsignore
# does not fix it: it governs what is uploaded, not what is watched. Naming
# the output also means the deploy cannot leak the generator, the checks or
# the screenshots by forgetting a line.
directory = "dist"
binding = "ASSETS"

# The Worker runs for nine paths. Everything else — every other page, every
# stylesheet, font and image, and the whole design system — is served straight
# from the edge without this code being invoked or billed.
#
#   /kontakt.html       the two forms' POSTs, each in both editions: contact
#   /en/kontakt.html    and application. Every one of them posts to its own
#   /bewerbung.html     address, so every one of them needs a line here.
#   /en/bewerbung.html
#
#                       A path missing from this list is not an error anyone
#                       sees. The asset server answers the POST instead — with
#                       the page and a 200, or with a 405 — and no mail is ever
#                       sent. check-form-contract.py compares this list against
#                       worker/index.js's FORMS table for exactly that reason.
#
#                       A GET reaches the Worker too and is passed through to
#                       the same static file; that costs one invocation per view
#                       of a form page and buys the guarantee that the POST
#                       cannot be answered by the file.
#
#   /, /en and          the three directory indexes, which html_handling =
#   /design-system      "none" below switches off. The Worker serves them.
#
# scripts/stage-site.py --check fails if dist/ grows a directory index that
# is not in this list, so the list cannot quietly fall behind the site.
run_worker_first = [
  "/kontakt.html",
  "/en/kontakt.html",
  "/bewerbung.html",
  "/en/bewerbung.html",
  "/",
  "/en",
  "/en/",
  "/design-system",
  "/design-system/",
]

# Serve the files under the names they have.
#
# Every other mode answers /kontakt.html with a 307 to /kontakt — measured,
# all three of them. That would rewrite the address of every page on the site,
# and every href between them is written *.html, because that is how these
# pages have always been served. It would also break the form outright:
# run_worker_first names /kontakt.html, and a redirect away from that path
# answers the POST with a 307 instead of running any of this.
#
# The cost is the directory indexes — with "none", / and /design-system/ are
# 404s, because nothing maps a directory to its index.html any more. The
# Worker does that instead, for the two directories that have one.
html_handling = "none"

# 404s are a page, not a status line: the repo has one and it is the site's.
not_found_handling = "404-page"

# The brake on the form. Ten submits per minute per IP, counted at one
# Cloudflare location — far above a person filling in a form and far below
# anything worth writing a script for.
#
# namespace_id is an identifier chosen here, not one Cloudflare hands out; it
# only has to stay unique within the account and stable across deploys.
[[ratelimits]]
name = "CONTACT_RATE_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[vars]
# Where enquiries go, and who they come from. Neither is a secret, so both
# live here where they can be read and reviewed.
#
# CONTACT_FROM must be on a domain verified with the mail provider — a contact
# form cannot send *as* the person who filled it in without failing SPF and
# DKIM. Their address goes in Reply-To instead, which worker/mail.js sets, so
# hitting reply still reaches them.
#
# control-f.io and not control-f.de, on both lines and for two different
# reasons. CONTACT_TO is the address the site itself publishes — every footer,
# both contact pages and the Impressum say info@control-f.io, and an enquiry
# that went anywhere else would land in a mailbox no page names. CONTACT_FROM
# is the harder constraint: control-f.io is the domain verified in Resend, and
# a From on any other domain is rejected before it is sent.
CONTACT_FROM = "Kontaktformular <formular@control-f.io>"
CONTACT_TO = "info@control-f.io"

# Where applications go. Its own name rather than reusing CONTACT_TO, because
# these are two different kinds of post that will not always want the same
# mailbox: an application carries a CV and falls under a six-month deletion
# rule, an enquiry does not.
#
# info@control-f.io for now, and deliberately not the jobs@control-f.de that
# the career pages carried until 2026-08-07: control-f.de does not resolve,
# is not verified in Resend, and is not an address any other page on this site
# publishes any more. Pointing applications at it would have lost them.
#
# worker/mail.js falls back to CONTACT_TO if this is absent, so a missing line
# delivers to a monitored mailbox rather than throwing an application away.
APPLY_TO = "info@control-f.io"

# THE ONE LINE THE DOMAIN CUTOVER CHANGES. Two things read it:
#
#   the Worker   where a successful submit sends the reader back to. The
#                website is on GitHub Pages, which answers a POST with 405, so
#                the form posts across origins to this Worker and this is the
#                address it came from, subdirectory and all. Without it a reader
#                who submitted from Pages would be left on workers.dev.
#   the build    what "this site's address" is: og:image, og:url and the
#                canonical link on every card page (scripts/og_meta.py), the
#                sitemap and the redirect stubs for the old Wix addresses
#                (scripts/stage-site.py), and _headers — while it is set, the
#                Worker copy is the second copy and is marked noindex.
#
# AT THE CUTOVER THIS BECOMES "https://www.control-f.io" — changed, not
# deleted: the build stops without it, and the Worker still needs to send the
# reader back to the site rather than to its own address. Everything generated
# moves with the one edit; the thirteen authored pattern pages spell the
# address out in their own <head> and are edited in the same commit, which
# check-open-graph.py enforces. The merge is step 3 of README.md's "Domain
# cutover".
#
# NO TRAILING SLASH: the paths in worker/index.js's FORMS table start with one.
SITE_ORIGIN = "https://control-f-io.github.io/control-f-website"

# RESEND_API_KEY is a secret and is deliberately absent. Set it once with:
#
#     npx wrangler secret put RESEND_API_KEY
#
# For local development put it in .dev.vars, which .gitignore already covers.
